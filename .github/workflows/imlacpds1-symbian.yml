  host-test:
    name: Core tests (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian
      - run: pip install pillow
      - name: Run host checks (freestanding core, sanitizers, API-stub type check, preview)
        run: bash symbian/host_test/run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: host-preview
          path: symbian/host_test/out/preview.png

  build-sis:
    name: Build imlacpds1.sisx
    needs: [sources, host-test]
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: symbian

      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"

      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          # install-sdk.sh requires perl to resolve to /opt/homebrew/opt/perl/bin/perl, not the linked
          # /opt/homebrew/bin/perl symlink, so keep the keg unlinked (as on a stock Mac).
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}

      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Offline build (no sockets / no libc.lib)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.net == false }}
        run: |
          cd "symbian/group"
          /usr/bin/sed -i '' '/^LIBRARY[[:space:]]*libc\.lib/d' imlacpds1.mmp
          echo 'MACRO IMLAC_NO_NET' >> imlacpds1.mmp

      - name: Show toolchain environment
        run: |
          source toolchain/Scripts/env.sh
          env | grep -iE 'symbian|n8_|epoc|gnupoc' | sort || true
          ls "$SYMBIAN_VOL" || true

      - name: Build Imlac PDS-1
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          cd "symbian/group"
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/abld.log"

      - name: Verify the executable was produced
        run: |
          set -eo pipefail
          # abld -keepgoing can exit 0 even when a file failed to compile
          grep -nE "(error:|Error [0-9]|undefined reference|No such file)" abld.log | head -50 || true
          EXE="$(find "$SYMBIAN_VOL" -iname imlacpds1.exe -path '*urel*' 2>/dev/null | head -1)"
          echo "exe: ${EXE:-<none>}"
          test -n "$EXE"

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          E=/Volumes/Symbian/sdks/symbian3/epoc32
          echo "--- stdapis/sys headers"; ls $E/include/stdapis/sys 2>&1 | head -80
          echo "--- Open C import libs"; ls $E/release/armv5/lib 2>&1 | grep -iE "^(libc|libm|libpthread|esock|insock)" || true
          echo "--- headers declaring fd_set"; grep -rl "fd_set" $E/include/stdapis 2>/dev/null | head || true

      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" "symbian/sis/imlacpds1.pkg" "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: imlacpds1-symbian3
          path: dist/imlacpds1.sisx

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abld-log
          path: abld.log
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/imlacpds1.sisx
