          // Machine.h - Imlac PDS-1 emulator core (portable C++03)
          #ifndef IMLAC_MACHINE_H
          #define IMLAC_MACHINE_H
          #include "Types.h"

          #define MACHINE_MEM_SIZE  4096
          #define MACHINE_WORD_MASK 0xFFFF
          #define MACHINE_ADDR_MASK 0x0FFF
          #define MACHINE_MAX_VEC   8192      // 12 bytes each; the iOS build used 32768

          struct MachineVec {
              s16 x1, y1, x2, y2;
              u8  isPoint;
              u8  bright;                     // 0..255
          };

          class Machine {
          public:
              Machine();

              // MP registers
              int  mp_pc, mp_ac, mp_ir, mp_link;
              bool mp_halt, mp_run;

              // DP registers
              int   dp_pc, dp_ac, dp_x, dp_y;
              bool  dp_halt, dp_enabled;
              int   dp_intensity;
              float dp_scale;

              int mem[MACHINE_MEM_SIZE];

              // I/O
              int  keyboard;
              int  lpen_x, lpen_y;
              bool lpen_hit;

              // Display list
              MachineVec vecs[MACHINE_MAX_VEC];
              int        nvec;

              // Console (small ring: oldest text is dropped)
              char console[256];
              int  consoleLen;
              int  cycles;

              void reset();
              void powerOn();

              void dlLine(int x1, int y1, int x2, int y2, float bright);
              void dlPoint(int x, int y, float bright);
              void dlClear() { nvec = 0; }

              void mpStep();
              void dpStep();

              // Returns number of words emitted (assembly starts at 0x050).
              int assemble(const char* src);

              void consoleAppend(const char* s);

          private:
              void mpSkip(int word);
              void mpOPR(int word);
              void mpIOT(int word);

              int dp_ret_stack[16];
              int dp_ret_top;
          };

          #endif
