          // NetSession.cpp - polled, single-threaded UDP session (BSD sockets / Open C)
          //
          // Build with -DIMLAC_NO_NET (MACRO IMLAC_NO_NET in the .mmp, and drop libc.lib) to get an offline
          // build: the LAN menu items then simply report "network unavailable" and no socket header is needed.
