              void* operator new(size_t s, TLeave) { return calloc(1, s); } void Start(TInt, TInt, TCallBack) {} };
          class CleanupStack { public: static void PushL(CBase*) {} static void Pop(CBase*) {} };
          namespace User { inline void LeaveIfError(TInt) {} inline void ResetInactivityTime() {} inline TUint NTickCount() { return 0; } }
          namespace Math { inline TUint32 Random() { return 1; } }
