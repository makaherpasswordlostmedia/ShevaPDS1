          // ---- maze generation ------------------------------------------------------

          void MazeWarGame::startGameWithSeed(u32 seed) {
              genMazeWithSeed(seed & 0x7FFFFFFFu);
              px = 1; py = 1; pdir = 0; hp = 3; score = 0; level = 1;
              moveCd = turnCd = fireCd = hitFlash = killFlash = 0;
              mem_set(bullets, 0, sizeof(bullets));
              nEnemies = 0;
              if (!multiMode) spawnAI(level + 1);
              state = EStatePlay;
          }

          void MazeWarGame::genMazeWithSeed(u32 seed) {
              for (int i = 0; i < MZ * MZ; i++) maze[i] = 0xF;
              u32 rng = seed;
              bool vis[MZ * MZ];
              mem_set(vis, 0, sizeof(vis));
              carve(1, 1, vis, &rng);
          }

          // 32-bit wrap-around LCG: identical on every device, so both peers build the same maze.
          int MazeWarGame::nextRnd(u32* rng) {
              *rng = (*rng) * 1664525u + 1013904223u;
              return (int)((*rng >> 16) & 0x7FFF);
          }

          void MazeWarGame::carve(int x, int y, bool* vis, u32* rng) {
              vis[y * MZ + x] = true;
              int d[4] = {0, 1, 2, 3};
              for (int i = 3; i >= 1; i--) {
                  int j = nextRnd(rng) % (i + 1);
                  int t = d[i]; d[i] = d[j]; d[j] = t;
              }
              for (int k = 0; k < 4; k++) {
                  int dd = d[k];
                  int nx = x + DX[dd], ny = y + DY[dd];
                  if (nx < 1 || nx >= MZ - 1 || ny < 1 || ny >= MZ - 1 || vis[ny * MZ + nx]) continue;
                  maze[y * MZ + x]   &= ~(1 << dd);
                  maze[ny * MZ + nx] &= ~(1 << OPP[dd]);
                  carve(nx, ny, vis, rng);
              }
          }

          bool MazeWarGame::wall(int x, int y, int dir) const {
              if (x < 0 || x >= MZ || y < 0 || y >= MZ) return true;
              return (maze[y * MZ + x] & (1 << dir)) != 0;
          }

          bool MazeWarGame::solid(int x, int y) const {
              if (x < 0 || x >= MZ || y < 0 || y >= MZ) return true;
              return maze[y * MZ + x] == 0xF;
          }

          void MazeWarGame::spawnAI(int n) {
              for (int i = 0; i < n && nEnemies < MW_MAX_ENEMY; i++) {
                  int ex = 0, ey = 0;
                  for (int tries = 0; tries < 200; tries++) {
                      ex = 2 + (int)RandBelow((u32)(MZ - 4));
                      ey = 2 + (int)RandBelow((u32)(MZ - 4));
                      if (!solid(ex, ey) && (iabs(ex - px) + iabs(ey - py) > 3)) break;
                  }
                  Enemy& e = enemies[nEnemies++];
                  e.x = ex; e.y = ey; e.dir = (int)RandBelow(4); e.think = 30; e.fireCd = 80; e.alive = true;
              }
          }

          void MazeWarGame::addBullet(double x, double y, int dir, bool fromPlayer) {
              for (int i = 0; i < MW_MAX_BULLET; i++) {
                  if (bullets[i].alive) continue;
                  Bullet& b = bullets[i];
                  b.x = x; b.y = y; b.dir = dir; b.life = 55; b.fromPlayer = fromPlayer; b.alive = true;
                  return;
              }
          }

          // ---- play tick ------------------------------------------------------------

          void MazeWarGame::tickPlay() {
              if (moveCd > 0) moveCd--;
              if (turnCd > 0) turnCd--;
              if (fireCd > 0) fireCd--;
              if (hitFlash > 0) hitFlash--;
              if (killFlash > 0) killFlash--;
              if (msgT > 0) msgT--;
              if (netHitFlash > 0) netHitFlash--;

              if (turnCd == 0) {
                  if (iLeft && !pLeft)   { pdir = (pdir + 3) % 4; turnCd = 8; }
                  if (iRight && !pRight) { pdir = (pdir + 1) % 4; turnCd = 8; }
              }
              if (moveCd == 0) {
                  if (iUp && !wall(px, py, pdir)) { px += DX[pdir]; py += DY[pdir]; moveCd = 12; }
                  else if (iDown && !wall(px, py, (pdir + 2) % 4)) { px -= DX[pdir]; py -= DY[pdir]; moveCd = 12; }
              }
              if (iFire && !pFire && fireCd == 0) {
                  addBullet((double)px + 0.5, (double)py + 0.5, pdir, true);
                  fireCd = 20;
                  if (net) net->sendBullet(pdir);
              }
              tickBullets();
              if (!multiMode) { tickAI(); checkWin(); }
              else if (!netAlive && netHitFlash <= 0) netAlive = true;

              if (multiMode && net && net->isConnected()) {
                  if (netSendCd <= 0) { net->sendMazeState(px, py, pdir, hp, score); netSendCd = 3; }
                  else netSendCd--;
              }
          }

          void MazeWarGame::tickBullets() {
              for (int bi = 0; bi < MW_MAX_BULLET; bi++) {
                  Bullet& b = bullets[bi];
                  if (!b.alive) continue;
                  b.life--;
                  if (b.life <= 0) { b.alive = false; continue; }
                  b.x += (double)DX[b.dir] * 0.2; b.y += (double)DY[b.dir] * 0.2;
                  if (solid((int)b.x, (int)b.y)) { b.alive = false; continue; }
                  if (b.fromPlayer) {
                      for (int ei = 0; ei < nEnemies; ei++) {
                          Enemy& e = enemies[ei];
                          if (!e.alive) continue;
                          if (fm_abs(b.x - ((double)e.x + 0.5)) < 0.6 && fm_abs(b.y - ((double)e.y + 0.5)) < 0.6) {
                              e.alive = false; b.alive = false; score += 1; killFlash = 12; setMsg("KILL", 30);
                              break;
                          }
                      }
                      if (b.alive && multiMode && netAlive &&
                          fm_abs(b.x - ((double)netX + 0.5)) < 0.6 && fm_abs(b.y - ((double)netY + 0.5)) < 0.6) {
                          b.alive = false; netAlive = false; netHitFlash = 20; score += 1;
                          if (net) net->sendKill();
                          setMsg("YOU KILLED OPPONENT!", 50);
                      }
                  } else {
                      if (fm_abs(b.x - ((double)px + 0.5)) < 0.55 && fm_abs(b.y - ((double)py + 0.5)) < 0.55) {
                          b.alive = false; hp -= 1; hitFlash = 18;
                          if (hp > 0) { char t[24]; str_set(t, sizeof(t), "HIT! HP:"); str_cat_int(t, sizeof(t), hp, 0); setMsg(t, 45); }
                          else        { setMsg("YOU DIED", 45); }
                          if (hp <= 0) state = EStateDead;
                      }
                  }
              }
          }

          void MazeWarGame::tickAI() {
              for (int ei = 0; ei < nEnemies; ei++) {
                  Enemy& e = enemies[ei];
                  if (!e.alive) continue;
                  e.think--; e.fireCd--;
                  if (e.think <= 0) {
                      e.think = 15 + (int)RandBelow(25);
                      int dx = px - e.x, dy = py - e.y;
                      int want = -1;
                      if (iabs(dx) > iabs(dy)) want = dx > 0 ? 1 : 3;
                      else if (dy != 0)        want = dy > 0 ? 0 : 2;
                      double r = (double)RandU32() / 4294967295.0;
                      if (r < 0.6 && want >= 0 && !wall(e.x, e.y, want)) {
                          e.dir = want; e.x += DX[want]; e.y += DY[want];
                      } else {
                          int ds[4] = {0, 1, 2, 3};
                          for (int i = 3; i >= 1; i--) {
                              int j = (int)RandBelow((u32)(i + 1));
                              int t = ds[i]; ds[i] = ds[j]; ds[j] = t;
                          }
                          for (int k = 0; k < 4; k++) {
                              int dd = ds[k];
                              if (!wall(e.x, e.y, dd)) { e.dir = dd; e.x += DX[dd]; e.y += DY[dd]; break; }
                          }
                      }
                  }
                  if (e.fireCd <= 0) {
                      bool sh = false;
                      if (e.dir == 0 && e.x == px && py > e.y) sh = los(e.x, e.y, px, py);
                      if (e.dir == 2 && e.x == px && py < e.y) sh = los(px, py, e.x, e.y);
                      if (e.dir == 1 && e.y == py && px > e.x) sh = los(e.x, e.y, px, py);
                      if (e.dir == 3 && e.y == py && px < e.x) sh = los(px, py, e.x, e.y);
                      if (sh) {
                          addBullet((double)e.x + 0.5, (double)e.y + 0.5, e.dir, false);
                          e.fireCd = 60 + (int)RandBelow(60);
                      }
                  }
              }
          }

          bool MazeWarGame::los(int x1, int y1, int x2, int y2) const {
              if (x1 == x2) { for (int y = y1; y < y2; y++) if (wall(x1, y, 0)) return false; }
              else          { for (int x = x1; x < x2; x++) if (wall(x, y1, 1)) return false; }
              return true;
          }

          void MazeWarGame::checkWin() {
              bool allDead = true;
              for (int i = 0; i < nEnemies; i++) if (enemies[i].alive) { allDead = false; break; }
              if (allDead) {
                  level += 1;
                  char t[24]; str_set(t, sizeof(t), "LEVEL "); str_cat_int(t, sizeof(t), level, 0); str_cat(t, sizeof(t), "!"); setMsg(t, 60);
                  genMazeWithSeed(RandU32());
                  px = 1; py = 1; pdir = 0;
                  mem_set(bullets, 0, sizeof(bullets));
                  nEnemies = 0;
                  spawnAI(imin(level + 1, 7));
              }
          }

          // ---- drawing --------------------------------------------------------------

          void MazeWarGame::drawPlay() {
              vl(VX0, VY0, VX1, VY0, 0.5f); vl(VX1, VY0, VX1, VY1, 0.5f);
              vl(VX1, VY1, VX0, VY1, 0.5f); vl(VX0, VY1, VX0, VY0, 0.5f);
              if (hitFlash > 0) {
                  float f = (float)hitFlash / 18;
                  vl(VX0, VY0, VX1, VY0, f); vl(VX1, VY0, VX1, VY1, f);
                  vl(VX1, VY1, VX0, VY1, f); vl(VX0, VY1, VX0, VY0, f);
              }
              draw3D(); drawEnemiesInView(); drawHUD();
              if (msgT > 0) txt(msg, VCX - (int)str_len(msg) * 11, VCY - 60, 13, fminf_(1.0f, (float)msgT / 20));
              if (multiMode) {
                  bool connected = net && net->isConnected();
                  txt(connected ? "NET OK" : "NET...", VX0 + 8, VY0 - 22, 7, 0.4f);
              }
          }

          int MazeWarGame::clampX(int x) { return imax(VX0, imin(VX1, x)); }
          int MazeWarGame::clampY(int y) { return imax(VY0, imin(VY1, y)); }

          void MazeWarGame::draw3D() {
              const int MAXD = 10;
              int depth = 0, wx = px, wy = py;
              for (int d = 1; d <= MAXD; d++) {
                  if (wall(wx, wy, pdir)) { depth = d - 1; break; }
                  wx += DX[pdir]; wy += DY[pdir];
                  if (solid(wx, wy)) { depth = d - 1; break; }
                  depth = d;
              }
              depth = imax(0, depth);
              int lt[MAXD + 2], rt[MAXD + 2], tp[MAXD + 2], bt[MAXD + 2];
              for (int d = 0; d <= depth + 1; d++) {
                  float sc = 1.4f / (float)(d + 1);
                  lt[d] = clampX(VCX - (int)((float)VW / 2 * sc)); rt[d] = clampX(VCX + (int)((float)VW / 2 * sc));
                  tp[d] = clampY(VCY - (int)((float)VH / 2 * sc)); bt[d] = clampY(VCY + (int)((float)VH / 2 * sc));
              }
              int cx2 = px, cy2 = py;
              for (int d = 0; d <= depth; d++) {
                  float bright = fmaxf_(0.2f, 1.0f - (float)d * 0.1f);
                  bool hl = !wall(cx2, cy2, (pdir + 3) % 4);
                  bool hr = !wall(cx2, cy2, (pdir + 1) % 4);
                  bool hf = !wall(cx2, cy2, pdir) && d < depth;
                  if (!hl) {
                      vl(lt[d], tp[d], lt[d + 1], tp[d + 1], bright * 0.8f);
                      vl(lt[d], bt[d], lt[d + 1], bt[d + 1], bright * 0.8f);
                      vl(lt[d + 1], tp[d + 1], lt[d + 1], bt[d + 1], bright * 0.6f);
                  } else {
                      vl(lt[d], tp[d], lt[d], bt[d], bright * 0.5f);
                  }
                  if (!hr) {
                      vl(rt[d], tp[d], rt[d + 1], tp[d + 1], bright * 0.8f);
                      vl(rt[d], bt[d], rt[d + 1], bt[d + 1], bright * 0.8f);
                      vl(rt[d + 1], tp[d + 1], rt[d + 1], bt[d + 1], bright * 0.6f);
                  } else {
                      vl(rt[d], tp[d], rt[d], bt[d], bright * 0.5f);
                  }
                  if (!hf) {
                      vl(lt[d + 1], tp[d + 1], rt[d + 1], tp[d + 1], bright);
                      vl(lt[d + 1], bt[d + 1], rt[d + 1], bt[d + 1], bright);
                      vl(lt[d + 1], tp[d + 1], lt[d + 1], bt[d + 1], bright * 0.8f);
                      vl(rt[d + 1], tp[d + 1], rt[d + 1], bt[d + 1], bright * 0.8f);
                      break;
                  }
                  cx2 += DX[pdir]; cy2 += DY[pdir];
              }
              vl(VX0, VY0, lt[0], tp[0], 0.35f); vl(VX1, VY0, rt[0], tp[0], 0.35f);
              vl(VX0, VY1, lt[0], bt[0], 0.35f); vl(VX1, VY1, rt[0], bt[0], 0.35f);
              vl(VCX - 12, VCY, VCX - 4, VCY, 0.6f); vl(VCX + 4, VCY, VCX + 12, VCY, 0.6f);
              vl(VCX, VCY - 12, VCX, VCY - 4, 0.6f); vl(VCX, VCY + 4, VCX, VCY + 12, 0.6f);
          }

          void MazeWarGame::drawEnemiesInView() {
              for (int i = 0; i < nEnemies; i++) if (enemies[i].alive) drawEntityIfVisible(enemies[i].x, enemies[i].y, false);
              if (multiMode && netAlive) drawEntityIfVisible(netX, netY, true);
          }

          void MazeWarGame::drawEntityIfVisible(int ex, int ey, bool isNet) {
              int relDir = -1;
              if (pdir == 0 && ex == px && ey > py) relDir = 0;
              if (pdir == 1 && ey == py && ex > px) relDir = 1;
              if (pdir == 2 && ex == px && ey < py) relDir = 2;
              if (pdir == 3 && ey == py && ex < px) relDir = 3;
              if (relDir != pdir) return;
              int dist = (pdir == 0 || pdir == 2) ? iabs(ey - py) : iabs(ex - px);
              if (!(dist >= 1 && dist <= 8)) return;
              for (int d = 0; d < dist; d++) {
                  if (wall(px + DX[pdir] * d, py + DY[pdir] * d, pdir)) return;
              }
              float sc = 1.4f / ((float)dist + 0.5f);
              int sz = imax(8, imin((int)((float)VH * 0.25f * sc), 120));
              float b = fmaxf_(0.3f, 0.9f - (float)dist * 0.08f);
              if (isNet && netHitFlash > 0) b = 1.0f;
              drawEye(VCX, VCY, sz, b);
          }

          void MazeWarGame::drawEye(int cx, int cy, int sz, float b) {
              int rx = sz, ry = (int)((float)sz * 0.55f);
              circle(cx, cy, rx, ry, 16, b);
              circle(cx, cy, rx / 3, (int)((float)ry * 0.7f), 10, b * 1.1f);
              vl(cx - rx, cy, cx + rx, cy, b * 0.3f);
              if (sz > 25) {
                  for (int i = -2; i <= 2; i++) {
                      if (i == 0) continue;
                      vl(cx + i * (rx / 3), cy + ry + 2, cx + i * (rx / 3) + i * 4, cy + ry + 20, b * 0.6f);
                  }
              }
          }

          void MazeWarGame::drawHUD() {
              for (int i = 0; i < 3; i++) {
                  int hx = VX0 + 20 + i * 28;
                  circle(hx, VY1 + 25, 9, 9, 8, (i < hp ? 0.9f : 0.2f));
              }
              char buf[24];
              buf[0] = 0; str_cat_int(buf, sizeof(buf), score, 4);
              txt(buf, VX1 - 120, VY1 + 18, 9, 0.7f);
              static const char* const dirNames[4] = {"N", "E", "S", "W"};
              txt(dirNames[pdir & 3], VX1 + 15, VY1 + 18, 10, 0.6f);
              str_set(buf, sizeof(buf), "LV"); str_cat_int(buf, sizeof(buf), level, 0);
              txt(buf, VCX - 32, VY0 - 22, 9, 0.35f);
              if (fireCd > 0) vl(VCX - 40, VY1 + 52, VCX - 40 + (int)((float)fireCd / 20 * 80), VY1 + 52, 0.4f);
              if (multiMode) {
                  str_set(buf, sizeof(buf), "OPP:"); str_cat_int(buf, sizeof(buf), netScore, 4);
                  txt(buf, VX0 + 8, VY1 + 18, 9, 0.5f);
              }
          }

          void MazeWarGame::vl(int x1, int y1, int x2, int y2, float b) { M.dlLine(x1, y1, x2, y2, b); }

          void MazeWarGame::circle(int cx, int cy, int rx, int ry, int segs, float b) {
              int ppx = cx + rx, ppy = cy;
              for (int i = 1; i <= segs; i++) {
                  double a = (double)i / (double)segs * 2 * M_PI;
                  int nx = cx + (int)(fm_cos(a) * rx), ny = cy + (int)(fm_sin(a) * ry);
                  vl(ppx, ppy, nx, ny, b);
                  ppx = nx; ppy = ny;
              }
          }

          void MazeWarGame::glyph(char c, int ox, int oy, float sc, float b) {
              int idx = VecFontIndex(c);
              if (idx < 0) return;
              int n = kVecFontSegs[idx];
              for (int s = 0; s < n; s++) {
                  const signed char* seg = kVecFont[idx][s];
                  vl(ox + (int)(seg[0] * sc), oy + (int)(seg[1] * sc), ox + (int)(seg[2] * sc), oy + (int)(seg[3] * sc), b);
              }
          }

          void MazeWarGame::txt(const char* s, int ox, int oy, float sc, float b) {
              int x = ox;
              for (; *s; ++s) { glyph(*s, x, oy, sc, b); x += (int)(sc * 5.5f); }
          }

          // ---- MNetListener ---------------------------------------------------------

          void MazeWarGame::onConnected(bool asHost, int seed) {
              genMazeWithSeed((u32)seed);
              if (asHost) { px = 1;  py = 1;  pdir = 0; netX = 14; netY = 14; netDir = 2; }
              else        { px = 14; py = 14; pdir = 2; netX = 1;  netY = 1;  netDir = 0; }
              hp = 3; score = 0; netHp = 3; netScore = 0; netAlive = true;
              mem_set(bullets, 0, sizeof(bullets));
              state = EStatePlay; setMsg("CONNECTED! FIGHT!", 50);
          }

          void MazeWarGame::onPeerMazeState(int x, int y, int dir, int hp2, int sc) {
              netX = x; netY = y; netDir = dir; netHp = hp2; netScore = sc; netAlive = (hp2 > 0);
          }

          void MazeWarGame::onPeerSync(int, int) {}

          void MazeWarGame::onPeerBullet(int dir) {
              addBullet((double)netX + 0.5, (double)netY + 0.5, dir & 3, false);
          }

          void MazeWarGame::onPeerKilled() { netAlive = false; netHitFlash = 20; setMsg("OPPONENT KILLED!", 40); }

          void MazeWarGame::onDisconnected() {
              setMsg("DISCONNECTED", 80); multiMode = false;
              state = (state == EStatePlay) ? EStateDead : EStateTitle;
          }

