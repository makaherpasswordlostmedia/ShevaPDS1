          // ---------------------------------------------------------------------------
          // Construction
          // ---------------------------------------------------------------------------
          CImlacContainer* CImlacContainer::NewL(const TRect& aRect)
              {
              CImlacContainer* self = new (ELeave) CImlacContainer;
              CleanupStack::PushL(self);
              self->ConstructL(aRect);
              CleanupStack::Pop(self);
              return self;
              }

          CImlacContainer::CImlacContainer()
              : iDemos(iMachine)
              {
              }

          CImlacContainer::~CImlacContainer()
              {
              StopTimer();
              delete iTimer;
              iNet.stop();
              delete iFrame;
              }

          void CImlacContainer::ConstructL(const TRect& aRect)
              {
              CreateWindowL();
              SetExtentToWholeScreen();
              EnableDragEvents();
              SetFocusing(ETrue);

              iFrame = new (ELeave) CFbsBitmap;
              User::LeaveIfError(iFrame->Create(TSize(KCrtW, KCrtH), EColor16MU));
              iFrame->LockHeap();
              CrtRenderer::clear((u32*)iFrame->DataAddress(), KCrtW, KCrtH, iFrame->DataStride() / 4);
              iFrame->UnlockHeap();

              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);

              RandSeed(Math::Random());
              iDemos.setDemo(DemoTypeStar);
              iForeground = ETrue;
              iMenu = EFalse;
              iMenuPage = 0;
              iMenuSel = 0;
              iHeld = -1;
              str_set(iNetStatus, sizeof(iNetStatus), "OFFLINE");
              iFpsStart = User::NTickCount();

              SetRect(aRect);
              ActivateL();
              StartTimer();
              }

          void CImlacContainer::StartTimer()
              {
              if (iTimer && !iTimer->IsActive())
                  {
                  iTimer->Start(KFrameMicros, KFrameMicros, TCallBack(TickCb, this));
                  }
              }

          void CImlacContainer::StopTimer()
              {
              if (iTimer)
                  {
                  iTimer->Cancel();
                  }
              }

          void CImlacContainer::SetForeground(TBool aForeground)
              {
              iForeground = aForeground;
              if (aForeground)
                  {
                  StartTimer();
                  }
              else
                  {
                  StopTimer();
                  if (iHeld >= 0)
                      {
                      PressButton(iHeld, EFalse);
                      iHeld = -1;
                      }
                  }
              }

          // ---------------------------------------------------------------------------
          // Frame tick: network, CPU/DP, demo, phosphor render, blit
          // ---------------------------------------------------------------------------
          TInt CImlacContainer::TickCb(TAny* aPtr)
              {
              static_cast<CImlacContainer*>(aPtr)->Tick();
              return 0;
              }

          void CImlacContainer::Tick()
              {
              if (!iForeground)
                  {
                  return;
                  }
              User::ResetInactivityTime();       // keep the backlight on while playing

              if (iNet.isActive())
                  {
                  iNet.poll();
                  }

              iMachine.dlClear();
              if (iMachine.mp_run)
                  {
                  // the iOS build ran 200 MP + 50 DP steps per millisecond on a worker thread
                  for (TInt i = 0; i < 25; ++i)
                      {
                      for (TInt j = 0; j < 200; ++j) iMachine.mpStep();
                      for (TInt j = 0; j < 50; ++j) iMachine.dpStep();
                      }
                  }
              iDemos.runCurrentDemo();

              iFrame->LockHeap();
              CrtRenderer::render((u32*)iFrame->DataAddress(), KCrtW, KCrtH, iFrame->DataStride() / 4, iMachine);
              iFrame->UnlockHeap();

              ++iFpsCount;
              TUint now = User::NTickCount();
              if (now - iFpsStart >= 1000)
                  {
                  iFps = iFpsCount;
                  iFpsCount = 0;
                  iFpsStart = now;
                  }
              DrawNow();
              }

          // ---------------------------------------------------------------------------
          // Layout
          // ---------------------------------------------------------------------------
          void CImlacContainer::SizeChanged()
              {
              ComputeLayout();
              }

          void CImlacContainer::ComputeLayout()
              {
              TRect r = Rect();
              TInt w = r.Width(), h = r.Height();
              TInt side = Min(h, w - 240);
              if (side < 120)
                  {
                  side = Min(h, w);
                  }
              TInt x0 = (w - side) / 2;
              TInt y0 = (h - side) / 2;
              iCrtRect = TRect(x0, y0, x0 + side, y0 + side);
              iLeftPanel = TRect(0, 0, x0, h);
              iRightPanel = TRect(x0 + side, 0, w, h);

              // D-pad in the lower part of the left panel
              TInt lw = iLeftPanel.Width();
              TInt bs = Min(lw / 3, h / 4);
              if (bs < 28) bs = 28;
              TInt cx = lw / 2;
              TInt cy = h - (bs * 3) / 2 - 6;
              iBtn[0] = TRect(cx - bs / 2, cy - (bs * 3) / 2, cx + bs / 2, cy - bs / 2);       // up
              iBtn[1] = TRect(cx - bs / 2, cy + bs / 2, cx + bs / 2, cy + (bs * 3) / 2);       // down
              iBtn[2] = TRect(cx - (bs * 3) / 2, cy - bs / 2, cx - bs / 2, cy + bs / 2);       // left
              iBtn[3] = TRect(cx + bs / 2, cy - bs / 2, cx + (bs * 3) / 2, cy + bs / 2);       // right

              // Menu + fire buttons in the right panel
              TInt rx0 = iRightPanel.iTl.iX + 8, rx1 = iRightPanel.iBr.iX - 8;
              iBtnMenu = TRect(rx0, 6, rx1, 46);
              TInt fh = Min(64, h / 5);
              iBtn[5] = TRect(rx0, h - fh - 8, rx1, h - 8);                  // A
              iBtn[4] = TRect(rx0, h - 2 * fh - 16, rx1, h - fh - 16);       // B
              }

          // ---------------------------------------------------------------------------
          // Drawing
          // ---------------------------------------------------------------------------
          void CImlacContainer::DrawStr(CWindowGc& aGc, const char* aText, TInt aX, TInt aBaseline) const
              {
              TBuf<48> t;
              ToDes(t, aText);
              aGc.DrawText(t, TPoint(aX, aBaseline));
              }

          void CImlacContainer::DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(TRgb(0, 150, 60));
              if (aDown)
                  {
                  aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
                  aGc.SetBrushColor(TRgb(0, 90, 40));
                  }
              else
                  {
                  aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
                  }
              aGc.DrawRect(aRect);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              aGc.SetPenColor(TRgb(120, 255, 150));
              TInt base = (aRect.Height() + font->AscentInPixels() - font->DescentInPixels()) / 2;
              aGc.DrawText(aLabel, aRect, base, CGraphicsContext::ECenter, 0);
              aGc.DiscardFont();
              }

          TRect CImlacContainer::MenuBox() const
              {
              TRect r = Rect();
              TInt h = kPages[iMenuPage].iCount * KMenuRowH;
              return TRect((r.Width() - KMenuW) / 2, (r.Height() - h) / 2, (r.Width() + KMenuW) / 2, (r.Height() + h) / 2);
              }

          void CImlacContainer::DrawMenu(CWindowGc& aGc) const
              {
              TRect box = MenuBox();
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(TRgb(0, 180, 70));
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(TRgb(4, 20, 8));
              aGc.DrawRect(box);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              const TMenuPage& page = kPages[iMenuPage];
              for (TInt i = 0; i < page.iCount; ++i)
                  {
                  TRect row(box.iTl.iX, box.iTl.iY + i * KMenuRowH, box.iBr.iX, box.iTl.iY + (i + 1) * KMenuRowH);
                  if (i == iMenuSel)
                      {
                      aGc.SetPenStyle(CGraphicsContext::ENullPen);
                      aGc.SetBrushColor(TRgb(0, 80, 36));
                      aGc.DrawRect(row);
                      aGc.SetPenStyle(CGraphicsContext::ESolidPen);
                      }
                  aGc.SetPenColor(TRgb(140, 255, 170));
                  TBuf<32> label;
                  ToDes(label, page.iItems[i].iLabel);
                  TRect text(row.iTl.iX + 14, row.iTl.iY, row.iBr.iX, row.iBr.iY);
                  aGc.DrawText(label, text, KMenuRowH / 2 + font->AscentInPixels() / 2 - 2, CGraphicsContext::ELeft, 0);
                  }
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DiscardFont();
              }

          void CImlacContainer::Draw(const TRect& /*aRect*/) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);
              gc.Clear(Rect());
              gc.SetBrushStyle(CGraphicsContext::ENullBrush);

              gc.DrawBitmap(iCrtRect, iFrame);

              // status lines (left panel, top)
              const CFont* small = iEikonEnv->AnnotationFont();
              gc.UseFont(small);
              gc.SetPenColor(TRgb(0, 200, 70));
              char line[40];
              TInt lh = small->HeightInPixels() + 3;
              TInt y = lh;
              line[0] = 0; str_cat_int(line, sizeof(line), iFps, 0); str_cat(line, sizeof(line), "/30 fps");
              DrawStr(gc, line, 6, y); y += lh;
              str_set(line, sizeof(line), "PC:"); str_cat_hex(line, sizeof(line), (unsigned)iMachine.mp_pc, 4);
              str_cat(line, sizeof(line), " AC:"); str_cat_hex(line, sizeof(line), (unsigned)iMachine.mp_ac, 4);
              DrawStr(gc, line, 6, y); y += lh;
              str_set(line, sizeof(line), "IR:"); str_cat_hex(line, sizeof(line), (unsigned)iMachine.mp_ir, 4);
              str_cat(line, sizeof(line), " L:"); str_cat_int(line, sizeof(line), iMachine.mp_link, 0);
              DrawStr(gc, line, 6, y); y += lh;
              gc.SetPenColor(iMachine.mp_run ? TRgb(0, 200, 70) : TRgb(200, 160, 0));
              DrawStr(gc, iMachine.mp_run ? "MP RUN" : "MP HALT", 6, y);

              // network status + chat (right panel, under the Menu button)
              TInt ry = iBtnMenu.iBr.iY + lh + 2;
              TInt rx = iRightPanel.iTl.iX + 8;
              gc.SetPenColor(iNet.isConnected() ? TRgb(0, 255, 100) : TRgb(180, 90, 0));
              DrawStr(gc, iNetStatus, rx, ry);
              gc.SetPenColor(TRgb(0, 190, 70));
              for (TInt i = 0; i < iChatCount; ++i)
                  {
                  ry += lh;
                  DrawStr(gc, iChat[i], rx, ry);
                  }
              gc.DiscardFont();

              // touch controls
              static const char* const kLbl[6] = { "^", "v", "<", ">", "B", "A" };
              for (TInt i = 0; i < 6; ++i)
                  {
                  TBuf<4> l;
                  ToDes(l, kLbl[i]);
                  DrawButton(gc, iBtn[i], l, iDown[i]);
                  }
              DrawButton(gc, iBtnMenu, _L("MENU"), iMenu);

              if (iMenu)
                  {
                  DrawMenu(gc);
                  }
              }

          // ---------------------------------------------------------------------------
          // Input
          // ---------------------------------------------------------------------------
          TInt CImlacContainer::HitTest(const TPoint& aPt) const
              {
              for (TInt i = 0; i < 6; ++i)
                  {
                  if (iBtn[i].Contains(aPt))
                      {
                      return i;
                      }
                  }
              return -1;
              }

          // tag: 0 up, 1 down, 2 left, 3 right, 4 B, 5 A  (same mapping as the iOS D-pad)
          void CImlacContainer::PressButton(TInt aTag, TBool aDown)
              {
              if (aTag < 0 || aTag > 5)
                  {
                  return;
                  }
              iDown[aTag] = aDown;
              MazeWarGame* g = iDemos.getMazeWarGame();
              if (aDown)
                  {
                  switch (aTag)
                      {
                      case 0: iMachine.keyboard = 'W'; break;
                      case 1: iMachine.keyboard = 'S'; break;
                      case 2: iMachine.keyboard = 'A'; break;
                      case 3: iMachine.keyboard = 'D'; break;
                      default: iMachine.keyboard = 32; break;
                      }
                  if (g)
                      {
                      switch (aTag)
                          {
                          case 0: g->iUp = true; break;
                          case 1: g->iDown = true; break;
                          case 2: g->iLeft = true; break;
                          case 3: g->iRight = true; break;
                          default: g->iFire = true; break;
                          }
                      }
                  }
              else
                  {
                  iMachine.keyboard = 0;
                  if (g)
                      {
                      switch (aTag)
                          {
                          case 0: g->iUp = false; break;
                          case 1: g->iDown = false; break;
                          case 2: g->iLeft = false; break;
                          case 3: g->iRight = false; break;
                          default: g->iFire = false; break;
                          }
                      }
                  }
              }

          void CImlacContainer::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              const TPoint pt = aEvent.iPosition;

              if (iMenu)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      TRect box = MenuBox();
                      if (box.Contains(pt))
                          {
                          MenuActivate((pt.iY - box.iTl.iY) / KMenuRowH);
                          }
                      else
                          {
                          CloseMenu();
                          }
                      }
                  return;
                  }

              switch (aEvent.iType)
                  {
                  case TPointerEvent::EButton1Down:
                      if (iBtnMenu.Contains(pt))
                          {
                          OpenMenu();
                          return;
                          }
                      // fall through to the common press/drag handling
                  case TPointerEvent::EDrag:
                      {
                      TInt idx = HitTest(pt);
                      if (idx != iHeld)
                          {
                          if (iHeld >= 0)
                              {
                              PressButton(iHeld, EFalse);
                              }
                          iHeld = idx;
                          if (idx >= 0)
                              {
                              PressButton(idx, ETrue);
                              }
                          DrawNow();
                          }
                      break;
                      }
                  case TPointerEvent::EButton1Up:
                      if (iHeld >= 0)
                          {
                          PressButton(iHeld, EFalse);
                          iHeld = -1;
                          DrawNow();
                          }
                      break;
                  default:
                      break;
                  }
              }

          TKeyResponse CImlacContainer::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              const TInt sc = aKey.iScanCode;

              if (iMenu)
                  {
                  if (aType == EEventKeyDown)
                      {
                      const TMenuPage& page = kPages[iMenuPage];
                      if (sc == EStdKeyUpArrow && iMenuSel > 0) --iMenuSel;
                      else if (sc == EStdKeyDownArrow && iMenuSel < page.iCount - 1) ++iMenuSel;
                      else if (sc == EStdKeyEnter || sc == EStdKeyDevice3) { MenuActivate(iMenuSel); return EKeyWasConsumed; }
                      else if (sc == EStdKeyDevice0 || sc == EStdKeyDevice1) { CloseMenu(); return EKeyWasConsumed; }
                      DrawNow();
                      }
                  return EKeyWasConsumed;
                  }

              if (sc == EStdKeyDevice0 || sc == 'M')
                  {
                  if (aType == EEventKeyDown)
                      {
                      OpenMenu();
                      }
                  return EKeyWasConsumed;
                  }

              TInt tag = -1;
              switch (sc)
                  {
                  case EStdKeyUpArrow:    case 'W': tag = 0; break;
                  case EStdKeyDownArrow:  case 'S': tag = 1; break;
                  case EStdKeyLeftArrow:  case 'A': tag = 2; break;
                  case EStdKeyRightArrow: case 'D': tag = 3; break;
                  case EStdKeyDevice3:    case EStdKeySpace: case 'F': tag = 4; break;
                  default: break;
                  }
              if (tag >= 0)
                  {
                  if (aType == EEventKeyDown)
                      {
                      PressButton(tag, ETrue);
                      }
                  else if (aType == EEventKeyUp)
                      {
                      PressButton(tag, EFalse);
                      }
                  return EKeyWasConsumed;
                  }

              // any other key goes to the Imlac keyboard register
              TInt code = 0;
              if ((sc >= '0' && sc <= '9') || (sc >= 'A' && sc <= 'Z')) code = sc;
              else if (sc == EStdKeyEnter) code = 13;
              else if (sc == EStdKeyBackspace) code = 8;
              else if (sc == EStdKeyEscape) code = 27;
              if (code)
                  {
                  if (aType == EEventKeyDown)
                      {
                      iMachine.keyboard = code;
                      }
                  else if (aType == EEventKeyUp && iMachine.keyboard == code)
                      {
                      iMachine.keyboard = 0;
                      }
                  return EKeyWasConsumed;
                  }
              return EKeyWasNotConsumed;
              }

          // ---------------------------------------------------------------------------
          // Menu
          // ---------------------------------------------------------------------------
          void CImlacContainer::OpenMenu()
              {
              if (iHeld >= 0)
                  {
                  PressButton(iHeld, EFalse);
                  iHeld = -1;
                  }
              iMenu = ETrue;
              iMenuPage = 0;
              iMenuSel = 0;
              DrawNow();
              }

          void CImlacContainer::CloseMenu()
              {
              iMenu = EFalse;
              DrawNow();
              }

          void CImlacContainer::MenuActivate(TInt aIndex)
              {
              const TMenuPage& page = kPages[iMenuPage];
              if (aIndex < 0 || aIndex >= page.iCount)
                  {
                  return;
                  }
              iMenuSel = aIndex;
              TRAPD(err, ExecCommandL(page.iItems[aIndex].iCmd));
              (void)err;
              }

          void CImlacContainer::ExecCommandL(TInt aCmd)
              {
              switch (aCmd)
                  {
                  case ECmdClose: CloseMenu(); return;
                  case ECmdPageMain:    iMenuPage = 0; iMenuSel = 0; DrawNow(); return;
                  case ECmdPageMachine: iMenuPage = 1; iMenuSel = 0; DrawNow(); return;
                  case ECmdPageDemos:   iMenuPage = 2; iMenuSel = 0; DrawNow(); return;
                  case ECmdPageGame:    iMenuPage = 3; iMenuSel = 0; DrawNow(); return;
                  case ECmdExit:
                      iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                      return;

                  case ECmdPower: iMachine.powerOn(); break;
                  case ECmdReset: iMachine.reset(); break;
                  case ECmdRun:   iMachine.mp_halt = false; iMachine.mp_run = true; break;
                  case ECmdHalt:  iMachine.mp_halt = true;  iMachine.mp_run = false; break;
                  case ECmdStep:  iMachine.mpStep(); break;

                  case ECmdStar:     iDemos.setDemo(DemoTypeStar); break;
                  case ECmdScope:    iDemos.setDemo(DemoTypeScope); break;
                  case ECmdLiss:     iDemos.setDemo(DemoTypeLissajous); break;
                  case ECmdText:     iDemos.setDemo(DemoTypeText); break;
                  case ECmdBounce:   iDemos.setDemo(DemoTypeBounce); break;
                  case ECmdMaze:     iDemos.setDemo(DemoTypeMaze); break;
                  case ECmdSpacewar: iDemos.setDemo(DemoTypeSpacewar); break;
                  case ECmdLines:    iDemos.setDemo(DemoTypeLines); break;

                  case ECmdSingle: StartMazeWar(); break;
                  case ECmdHost:   HostGame(); break;
                  case ECmdJoin:   JoinGame(); break;
                  case ECmdDisc:   Disconnect(); break;
                  case ECmdChat:
                      CloseMenu();
                      AskChatL();
                      return;
                  default: break;
                  }
              CloseMenu();
              }

          // ---------------------------------------------------------------------------
          // Maze War / LAN
          // ---------------------------------------------------------------------------
          void CImlacContainer::StartMazeWar()
              {
              iNet.stop();
              SetNetStatus("OFFLINE");
              iDemos.initMazeWar();
              MazeWarGame* g = iDemos.getMazeWarGame();
              g->stopNet();
              iDemos.setDemo(DemoTypeMazeWar);
              g->startSinglePlayer();
              }

          void CImlacContainer::HostGame()
              {
              iNet.stop();
              iDemos.initMazeWar();
              MazeWarGame* g = iDemos.getMazeWarGame();
              iNet.setListeners(g, this);
              g->hostMulti(&iNet);
              iDemos.setDemo(DemoTypeMazeWar);
              SetNetStatus("HOSTING - waiting");
              AddChat("SYS: hosting :7474");
              int seed = (int)(RandU32() & 0x7FFFFFFFu);
              if (seed == 0) seed = 1;
              iNet.host(seed);            // may pop up the access point selection
              }

          void CImlacContainer::JoinGame()
              {
              iNet.stop();
              iDemos.initMazeWar();
              MazeWarGame* g = iDemos.getMazeWarGame();
              iNet.setListeners(g, this);
              g->joinMulti(&iNet);
              iDemos.setDemo(DemoTypeMazeWar);
              SetNetStatus("SEARCHING for host");
              AddChat("SYS: searching...");
              iNet.discover();
              }

          void CImlacContainer::Disconnect()
              {
              iNet.stop();
              MazeWarGame* g = iDemos.getMazeWarGame();
              if (g)
                  {
                  g->stopNet();
                  }
              SetNetStatus("OFFLINE");
              AddChat("SYS: disconnected");
              }

          void CImlacContainer::AskChatL()
              {
              if (!iNet.isConnected())
                  {
                  AddChat("SYS: not connected");
                  DrawNow();
                  return;
                  }
              TBuf<16> text;
              CAknTextQueryDialog* dlg = CAknTextQueryDialog::NewL(text);
              if (dlg->ExecuteLD(R_IMLAC_CHAT_QUERY) && text.Length() > 0)
                  {
                  TBuf8<16> t8;
                  t8.Copy(text);
                  char buf[16];
                  TInt n = t8.Length();
                  for (TInt i = 0; i < n; ++i) buf[i] = (char)t8[i];
                  buf[n] = 0;
                  iNet.sendChat(buf);
                  }
              DrawNow();
              }

          void CImlacContainer::AddChat(const char* aLine)
              {
              if (iChatCount == 4)
                  {
                  for (TInt i = 1; i < 4; ++i)
                      {
                      str_set(iChat[i - 1], sizeof(iChat[0]), iChat[i]);
                      }
                  --iChatCount;
                  }
              str_set(iChat[iChatCount], sizeof(iChat[0]), aLine);
              ++iChatCount;
              }

          void CImlacContainer::SetNetStatus(const char* aText)
              {
              str_set(iNetStatus, sizeof(iNetStatus), aText);
              }

          // MNetListener (UI side: status line and chat; the game logic has its own listener)
          void CImlacContainer::onConnected(bool aAsHost, int /*aSeed*/)
              {
              SetNetStatus(aAsHost ? "HOST connected" : "GUEST connected");
              AddChat(aAsHost ? "SYS: you=HOST" : "SYS: you=GUEST");
              }

          void CImlacContainer::onPeerMazeState(int, int, int, int, int) {}
          void CImlacContainer::onPeerSync(int, int) {}
          void CImlacContainer::onPeerBullet(int) {}
          void CImlacContainer::onPeerKilled() {}

          void CImlacContainer::onDisconnected()
              {
              SetNetStatus("DISCONNECTED");
              AddChat("SYS: peer lost");
              }

          void CImlacContainer::onChat(const char* aFrom, const char* aMsg)
              {
              char buf[24];
              str_set(buf, sizeof(buf), aFrom);
              str_cat(buf, sizeof(buf), ": ");
              str_cat(buf, sizeof(buf), aMsg);
              AddChat(buf);
              }
          IMLAC_EOF
          mkdir -p host_test/stubs
          cat > host_test/stubs/symbian_stub.h <<'IMLAC_EOF'
