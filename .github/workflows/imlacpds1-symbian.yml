          #include "Rand.h"

          static u32 gState = 0x9E3779B9u;

          void RandSeed(u32 seed) { gState = seed ? seed : 0x9E3779B9u; }

          u32 RandU32() {
              u32 x = gState;            // xorshift32
              x ^= x << 13;
              x ^= x >> 17;
              x ^= x << 5;
              gState = x;
              return x;
          }

          u32 RandBelow(u32 n) { return n ? (RandU32() % n) : 0; }
