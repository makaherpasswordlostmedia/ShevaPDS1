          #define VY0 80
          #define VY1 940
          #define VCX ((VX0 + VX1) / 2)
          #define VCY ((VY0 + VY1) / 2)
          #define VW  (VX1 - VX0)
          #define VH  (VY1 - VY0)
          #define MZ  MW_MZ

          static const int DX[4]  = {0, 1, 0, -1};
          static const int DY[4]  = {1, 0, -1, 0};
          static const int OPP[4] = {2, 3, 0, 1};

          MazeWarGame::MazeWarGame(Machine& machine)
              : net(0), iUp(false), iDown(false), iLeft(false), iRight(false), iFire(false), M(machine) {
              for (int i = 0; i < MZ * MZ; i++) maze[i] = 0xF;
              px = 1; py = 1; pdir = 0; hp = 3; score = 0; level = 1;
              moveCd = turnCd = fireCd = hitFlash = killFlash = 0;
              netX = 14; netY = 14; netDir = 2; netHp = 3; netScore = 0;
              netAlive = true; netHitFlash = 0; multiMode = false; netSendCd = 0;
              nEnemies = 0;
              mem_set(enemies, 0, sizeof(enemies));
              mem_set(bullets, 0, sizeof(bullets));
              state = EStateTitle; frame = 0; msg[0] = 0; msgT = 0; lobbyStatus[0] = 0;
              pUp = pDown = pLeft = pRight = pFire = false;
          }

          void MazeWarGame::setMsg(const char* s, int t) {
              str_set(msg, sizeof(msg), s); msgT = t;
          }

          // ---- public API -----------------------------------------------------------

          void MazeWarGame::tick() {
              int k = M.keyboard & 0x7F;
              iUp    = iUp    || (k == 'W');
              iDown  = iDown  || (k == 'S');
              iLeft  = iLeft  || (k == 'A');
              iRight = iRight || (k == 'D');
              iFire  = iFire  || (k == 32 || k == 'F');

              switch (state) {
              case EStateTitle: tickTitle(); break;
              case EStateLobby: break;
              case EStatePlay:  tickPlay();  break;
              case EStateDead:  tickDead();  break;
              }
              pUp = iUp; pDown = iDown; pLeft = iLeft; pRight = iRight; pFire = iFire;
              iUp = iDown = iLeft = iRight = iFire = false;
              frame += 1;
          }

          void MazeWarGame::draw() {
              switch (state) {
              case EStateTitle: drawTitle(); break;
              case EStateLobby: drawLobby(); break;
              case EStatePlay:  drawPlay();  break;
              case EStateDead:  drawDead();  break;
              }
          }

          void MazeWarGame::startSinglePlayer() {
              multiMode = false;
              startGameWithSeed(RandU32());
          }

          void MazeWarGame::hostMulti(NetSession* n) {
              net = n; multiMode = true;
              state = EStateLobby; str_set(lobbyStatus, sizeof(lobbyStatus), "HOSTING... WAIT FOR GUEST");
          }

          void MazeWarGame::joinMulti(NetSession* n) {
              net = n; multiMode = true;
              state = EStateLobby; str_set(lobbyStatus, sizeof(lobbyStatus), "SEARCHING FOR HOST...");
          }

          void MazeWarGame::stopNet() {
              if (net) net->stop();
              net = 0; multiMode = false; state = EStateTitle;
          }

          // ---- title / lobby / dead -------------------------------------------------

          void MazeWarGame::tickTitle() {
              bool anyNew = (iUp || iDown || iLeft || iRight || iFire) && !(pUp || pDown || pLeft || pRight || pFire);
              if (anyNew) startGameWithSeed(RandU32());
          }

          void MazeWarGame::tickDead() {
              bool anyNew = (iUp || iDown || iLeft || iRight || iFire) && !(pUp || pDown || pLeft || pRight || pFire);
              if (anyNew) { multiMode = false; state = EStateTitle; }
          }

          void MazeWarGame::drawTitle() {
              int ex = VCX + 100, ey = VCY, rx = 90, ry = 55;
              circle(ex, ey, rx, ry, 20, 0.9f);
              circle(ex, ey, rx / 3, (int)(ry * 0.8f), 12, 1.0f);
              for (int i = -3; i <= 3; i++) {
