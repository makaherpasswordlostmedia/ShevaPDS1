              TUint8 operator[](TInt i) const { return iPtr[i]; } TInt iLen; const TUint8* iPtr; };
          class TPtrC8 : public TDesC8 { public: TPtrC8(const TUint8* z) { iPtr = z; iLen = 0; while (z[iLen]) iLen++; }
              TPtrC8 Left(TInt n) const { TPtrC8 r(*this); if (n < r.iLen) r.iLen = n; return r; } };
