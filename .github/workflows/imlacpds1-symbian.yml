          int VecFontIndex(char c) {
              if (c >= 'a' && c <= 'z') c = (char)(c - 'a' + 'A');
              if (c >= 'A' && c <= 'Z') return c - 'A';
              if (c >= '0' && c <= '9') return 26 + (c - '0');
              if (c == ' ') return 36;
              return -1;
