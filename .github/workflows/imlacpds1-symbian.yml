          // FMath.cpp - sine table + square root (replaces libm; accuracy is far beyond what a 1024-unit
          // vector display needs). The table is built once on first use by rotating a unit vector.
          #include "Platform.h"

          #define SIN_N 1024               // table entries per full turn

          static float gSin[SIN_N + 1];
          static bool  gSinReady = false;

          static void buildSin() {
              // Taylor series on [0, pi/2] for one quadrant, mirrored for the rest.
              const double halfPi = M_PI / 2.0;
              const int q = SIN_N / 4;
              for (int i = 0; i <= q; i++) {
                  double x = halfPi * (double)i / (double)q;
                  double x2 = x * x;
                  double s = x * (1.0 + x2 * (-1.0 / 6 + x2 * (1.0 / 120 + x2 * (-1.0 / 5040 + x2 * (1.0 / 362880 + x2 * (-1.0 / 39916800))))));
                  gSin[i] = (float)s;
                  gSin[SIN_N / 2 - i] = (float)s;
                  gSin[SIN_N / 2 + i] = (float)-s;
                  gSin[SIN_N - i] = (float)-s;
              }
              gSin[SIN_N] = gSin[0];
              gSinReady = true;
          }

          double fm_sin(double x) {
              if (!gSinReady) buildSin();
              // Offset keeps the value positive for any angle the demos can produce (|x| < ~2e5).
              double t = x * ((double)SIN_N / (2.0 * M_PI)) + 4194304.0;     // 4194304 = 4096 turns
              int i = (int)t;
              float fr = (float)(t - (double)i);
              int k = i & (SIN_N - 1);
              return (double)(gSin[k] + (gSin[k + 1] - gSin[k]) * fr);
          }

          double fm_cos(double x) { return fm_sin(x + M_PI / 2.0); }

          double fm_sqrt(double x) {
              if (x <= 0.0) return 0.0;
              double g = x > 1.0 ? x * 0.5 : 1.0;
              for (int i = 0; i < 24; i++) {
                  double n = 0.5 * (g + x / g);
                  if (fm_abs(n - g) < 1e-9 * g) { g = n; break; }
                  g = n;
              }
              return g;
          }
