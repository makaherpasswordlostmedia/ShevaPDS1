          #include "Platform.h"

          #ifdef IMLAC_NO_NET

          NetSession::NetSession()
              : peerMazeX(1), peerMazeY(1), peerMazeDir(0), peerMazeHp(3), peerMazeScore(0),
                mazeSeed(0), myId(0), iStatus(EIdle), iGameSock(-1), iBcastSock(-1), iPeerIp(0),
                iFrame(0), iLastPeerFrame(0), iLastSendFrame(0), iStartFrame(0), iGame(0), iUi(0) {}
          NetSession::~NetSession() {}
          void NetSession::host(int) { fail(); }
          void NetSession::discover() { fail(); }
          void NetSession::stop() { iStatus = EIdle; }
          void NetSession::poll() {}
          void NetSession::fail() {
              iStatus = EIdle;
              if (iGame) iGame->onDisconnected();
              if (iUi)   iUi->onDisconnected();
          }
          void NetSession::closeAll() {}
          void NetSession::pollHost() {}
          void NetSession::pollGuest() {}
          void NetSession::pollGame() {}
          void NetSession::handlePacket(const u8*) {}
          void NetSession::sendToPeer(const u8*) {}
          void NetSession::makePacket(u8*, char, int, int, int, int) {}
          void NetSession::sendSync(int, int) {}
          void NetSession::sendMazeState(int, int, int, int, int) {}
          void NetSession::sendBullet(int) {}
          void NetSession::sendKill() {}
          void NetSession::sendChat(const char*) {}

          #else   // ---------------------------------------------------------------------

          #include <sys/types.h>
          #include <sys/socket.h>
          #include <sys/time.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          #include <unistd.h>
          #include <fcntl.h>

          #define NET_PEER_TIMEOUT_FRAMES   150    // ~6 s at 25 fps
          #define NET_SEARCH_TIMEOUT_FRAMES 750    // ~30 s
          #define NET_BCAST_EVERY           8      // guest broadcasts every 8 frames
          #define NET_KEEPALIVE_EVERY       25

          // Returns bytes received (0 when nothing is waiting or on error).
          static int recvPkt(int fd, u8* buf, struct sockaddr_in* src) {
              if (fd < 0) return 0;               // socket is non-blocking: returns <= 0 when nothing is waiting
              socklen_t len = (socklen_t)sizeof(*src);
              mem_set(src, 0, sizeof(*src));
              int n = (int)recvfrom(fd, (char*)buf, NET_PKT, 0, (struct sockaddr*)src, &len);
              return n > 0 ? n : 0;
          }

          static int makeUdpSocket(int port, bool broadcast) {
              int fd = (int)socket(AF_INET, SOCK_DGRAM, IPPROTO_UDP);
              if (fd < 0) return -1;
              // Never block the UI thread: non-blocking mode, plus a 1 ms receive timeout as a safety net in
              // case the C library ignores O_NONBLOCK on sockets. (select() is not declared by the Open C headers.)
              fcntl(fd, F_SETFL, O_NONBLOCK);
              struct timeval rt;
              rt.tv_sec = 0; rt.tv_usec = 1000;
              setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, (const char*)&rt, sizeof(rt));
              int on = 1;
              setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, (const char*)&on, sizeof(on));
              if (broadcast) setsockopt(fd, SOL_SOCKET, SO_BROADCAST, (const char*)&on, sizeof(on));
              struct sockaddr_in a;
              mem_set(&a, 0, sizeof(a));
              a.sin_family = AF_INET;
              a.sin_port = htons((unsigned short)port);
              a.sin_addr.s_addr = htonl(INADDR_ANY);
              if (bind(fd, (struct sockaddr*)&a, sizeof(a)) < 0) { close(fd); return -1; }
              return fd;
          }

          NetSession::NetSession()
              : peerMazeX(1), peerMazeY(1), peerMazeDir(0), peerMazeHp(3), peerMazeScore(0),
                mazeSeed(0), myId(0), iStatus(EIdle), iGameSock(-1), iBcastSock(-1), iPeerIp(0),
                iFrame(0), iLastPeerFrame(0), iLastSendFrame(0), iStartFrame(0), iGame(0), iUi(0) {}

          NetSession::~NetSession() { closeAll(); }

          void NetSession::closeAll() {
              if (iGameSock >= 0)  { close(iGameSock);  iGameSock = -1; }
              if (iBcastSock >= 0) { close(iBcastSock); iBcastSock = -1; }
          }

          void NetSession::host(int seed) {
              stop();
              mazeSeed = seed; myId = 0;
              iGameSock  = makeUdpSocket(NET_PORT_GAME, false);
              iBcastSock = makeUdpSocket(NET_PORT_BCAST, true);
              if (iGameSock < 0 || iBcastSock < 0) { fail(); return; }
              iStatus = EHosting;
          }

          void NetSession::discover() {
              stop();
              myId = 1;
              iGameSock = makeUdpSocket(NET_PORT_GAME, true);
              if (iGameSock < 0) { fail(); return; }
              iStatus = ESearching;
              iStartFrame = iFrame;
          }

          void NetSession::stop() {
              closeAll();
              iStatus = EIdle;
              iPeerIp = 0;
          }

          void NetSession::fail() {
              bool wasActive = (iStatus != EIdle);
              closeAll();
              iStatus = EIdle;
              iPeerIp = 0;
              (void)wasActive;
              if (iGame) iGame->onDisconnected();
              if (iUi)   iUi->onDisconnected();
          }

          void NetSession::poll() {
              iFrame++;
              switch (iStatus) {
              case EHosting:    pollHost();  break;
              case ESearching:  pollGuest(); break;
              case EConnected:  pollGame();  break;
              default: break;
              }
          }

          void NetSession::makePacket(u8* p, char type, int idv, int demo, int kbd, int seed) {
              mem_set(p, 0, NET_PKT);
              p[0] = (u8)type; p[1] = (u8)idv; p[2] = (u8)demo;
              p[3] = (u8)((kbd >> 8) & 0xFF); p[4] = (u8)(kbd & 0xFF);
              p[12] = (u8)((seed >> 24) & 0xFF); p[13] = (u8)((seed >> 16) & 0xFF);
              p[14] = (u8)((seed >> 8) & 0xFF);  p[15] = (u8)(seed & 0xFF);
          }

          void NetSession::pollHost() {
              u8 buf[NET_PKT];
              struct sockaddr_in src;

              // discovery requests -> answer with a welcome packet carrying the maze seed
              int n = recvPkt(iBcastSock, buf, &src);
              if (n == NET_PKT && buf[0] == 'D') {
                  u8 w[NET_PKT];
                  makePacket(w, 'W', 0, 0, 0, mazeSeed);
                  sendto(iGameSock, (const char*)w, NET_PKT, 0, (struct sockaddr*)&src, sizeof(src));
              }

              // join request -> connected
              n = recvPkt(iGameSock, buf, &src);
              if (n == NET_PKT && buf[0] == 'J') {
                  iPeerIp = src.sin_addr.s_addr;
                  iStatus = EConnected;
                  iLastPeerFrame = iFrame; iLastSendFrame = iFrame;
                  int seed = mazeSeed;
                  if (iGame) iGame->onConnected(true, seed);
                  if (iUi)   iUi->onConnected(true, seed);
              }
          }

          void NetSession::pollGuest() {
              if (iFrame - iStartFrame > NET_SEARCH_TIMEOUT_FRAMES) { fail(); return; }

              if (((iFrame - iStartFrame) % NET_BCAST_EVERY) == 0) {
                  u8 d[NET_PKT];
                  makePacket(d, 'D', 1, 0, 0, 0);
                  struct sockaddr_in b;
                  mem_set(&b, 0, sizeof(b));
                  b.sin_family = AF_INET;
                  b.sin_port = htons(NET_PORT_BCAST);
                  b.sin_addr.s_addr = htonl(INADDR_BROADCAST);
                  sendto(iGameSock, (const char*)d, NET_PKT, 0, (struct sockaddr*)&b, sizeof(b));
              }

              u8 buf[NET_PKT];
              struct sockaddr_in src;
              int n = recvPkt(iGameSock, buf, &src);
              if (n == NET_PKT && buf[0] == 'W') {
                  mazeSeed = ((int)buf[12] << 24) | ((int)buf[13] << 16) | ((int)buf[14] << 8) | (int)buf[15];
                  u8 j[NET_PKT];
                  makePacket(j, 'J', 1, 0, 0, 0);
                  sendto(iGameSock, (const char*)j, NET_PKT, 0, (struct sockaddr*)&src, sizeof(src));
                  iPeerIp = src.sin_addr.s_addr;
                  iStatus = EConnected;
                  iLastPeerFrame = iFrame; iLastSendFrame = iFrame;
                  int seed = mazeSeed;
                  if (iGame) iGame->onConnected(false, seed);
                  if (iUi)   iUi->onConnected(false, seed);
              }
          }

          void NetSession::pollGame() {
              u8 buf[NET_PKT];
              struct sockaddr_in src;
              for (int i = 0; i < 8 && iStatus == EConnected; i++) {      // drain a few packets per frame
                  int n = recvPkt(iGameSock, buf, &src);
                  if (n != NET_PKT) break;
                  iLastPeerFrame = iFrame;
                  handlePacket(buf);
              }
              if (iStatus != EConnected) return;
              if (iFrame - iLastPeerFrame > NET_PEER_TIMEOUT_FRAMES) { fail(); return; }
              if (iFrame - iLastSendFrame > NET_KEEPALIVE_EVERY) sendSync(0, 0);   // keep the peer's timeout from firing
          }

          void NetSession::handlePacket(const u8* p) {
              switch ((char)p[0]) {
              case 'S': {
                  int demo = p[2], kbd = (p[3] << 8) | p[4];
                  if (iGame) iGame->onPeerSync(demo, kbd);
                  if (iUi)   iUi->onPeerSync(demo, kbd);
                  break;
              }
              case 'M': {
                  int x = p[5], y = p[6], dir = p[7], hp = p[8], sc = (p[9] << 8) | p[10];
                  peerMazeX = x; peerMazeY = y; peerMazeDir = dir; peerMazeHp = hp; peerMazeScore = sc;
                  if (iGame) iGame->onPeerMazeState(x, y, dir, hp, sc);
                  break;
              }
              case 'B': if (iGame) iGame->onPeerBullet(p[11]); break;
              case 'K': if (iGame) iGame->onPeerKilled(); break;
              case 'C': {
                  char msg[16]; int i = 0;
                  for (; i < 15 && p[16 + i]; i++) msg[i] = (char)p[16 + i];
                  msg[i] = 0;
                  if (iUi) iUi->onChat("OPP", msg);
                  break;
              }
              case 'X': fail(); break;
              default: break;
              }
          }

          void NetSession::sendToPeer(const u8* pkt) {
              if (iGameSock < 0 || iPeerIp == 0) return;
              struct sockaddr_in a;
              mem_set(&a, 0, sizeof(a));
              a.sin_family = AF_INET;
              a.sin_port = htons(NET_PORT_GAME);
              a.sin_addr.s_addr = iPeerIp;
              sendto(iGameSock, (const char*)pkt, NET_PKT, 0, (struct sockaddr*)&a, sizeof(a));
              iLastSendFrame = iFrame;
          }

          void NetSession::sendSync(int demoIdx, int keyboard) {
              if (!isConnected()) return;
              u8 p[NET_PKT]; mem_set(p, 0, sizeof(p));
              p[0] = 'S'; p[1] = (u8)myId; p[2] = (u8)demoIdx;
              p[3] = (u8)((keyboard >> 8) & 0xFF); p[4] = (u8)(keyboard & 0xFF);
              sendToPeer(p);
          }

          void NetSession::sendMazeState(int x, int y, int dir, int hp, int score) {
              if (!isConnected()) return;
              u8 p[NET_PKT]; mem_set(p, 0, sizeof(p));
              p[0] = 'M'; p[1] = (u8)myId;
              p[5] = (u8)x; p[6] = (u8)y; p[7] = (u8)dir; p[8] = (u8)hp;
              p[9] = (u8)((score >> 8) & 0xFF); p[10] = (u8)(score & 0xFF);
              sendToPeer(p);
          }

          void NetSession::sendBullet(int dir) {
              if (!isConnected()) return;
              u8 p[NET_PKT]; mem_set(p, 0, sizeof(p));
              p[0] = 'B'; p[1] = (u8)myId; p[11] = (u8)dir;
              sendToPeer(p);
          }

          void NetSession::sendKill() {
              if (!isConnected()) return;
              u8 p[NET_PKT]; mem_set(p, 0, sizeof(p));
              p[0] = 'K'; p[1] = (u8)myId;
              sendToPeer(p);
          }

          void NetSession::sendChat(const char* text) {
              if (!isConnected()) return;
              u8 p[NET_PKT]; mem_set(p, 0, sizeof(p));
              p[0] = 'C'; p[1] = (u8)myId;
              int len = (int)str_len(text); if (len > 15) len = 15;
              for (int i = 0; i < len; i++) p[16 + i] = (u8)text[i];
              sendToPeer(p);
              if (iUi) iUi->onChat("ME", text);
          }

          #endif  // IMLAC_NO_NET
          IMLAC_EOF
          mkdir -p src/core
          cat > src/core/NetSession.h <<'IMLAC_EOF'
          // NetSession.h - UDP LAN multiplayer, wire-compatible with the iOS build
          // (ports 7474 game / 7475 discovery, 32-byte packets).
          //
          // Unlike the iOS version there is no worker thread: poll() is called once per
          // frame from the UI timer and uses select() with a zero timeout, so nothing
          // ever blocks and no locking is needed. All timeouts are counted in frames.
          #ifndef IMLAC_NETSESSION_H
          #define IMLAC_NETSESSION_H
          #include "Types.h"
          #include "NetListener.h"

          #define NET_PORT_GAME   7474
          #define NET_PORT_BCAST  7475
          #define NET_PKT         32

          class NetSession {
          public:
              NetSession();
              ~NetSession();

              // Two listeners: the game logic and the UI (status line / chat).
              void setListeners(MNetListener* game, MNetListener* ui) { iGame = game; iUi = ui; }

              void host(int seed);
              void discover();
              void stop();
              void poll();                       // call once per frame
              bool isConnected() const { return iStatus == EConnected; }
              bool isActive() const    { return iStatus != EIdle; }

              int peerMazeX, peerMazeY, peerMazeDir, peerMazeHp, peerMazeScore;
              int mazeSeed;
              int myId;

              void sendSync(int demoIdx, int keyboard);
              void sendMazeState(int x, int y, int dir, int hp, int score);
              void sendBullet(int dir);
              void sendKill();
              void sendChat(const char* text);

          private:
              enum Status { EIdle, EHosting, ESearching, EConnected };

              void pollHost();
              void pollGuest();
              void pollGame();
              void handlePacket(const u8* p);
              void fail();
              void closeAll();
              void sendToPeer(const u8* pkt);
              void makePacket(u8* p, char type, int idv, int demo, int kbd, int seed);

              Status iStatus;
              int    iGameSock, iBcastSock;
              u32    iPeerIp;                    // network byte order
              u32    iFrame, iLastPeerFrame, iLastSendFrame, iStartFrame;
              MNetListener* iGame;
              MNetListener* iUi;
          };

          #endif
          IMLAC_EOF
          mkdir -p src/core
          cat > src/core/Platform.h <<'IMLAC_EOF'
          // Platform.h - tiny libc/libm replacements so the core needs neither <string.h>, <stdio.h>,
          // <stdlib.h> nor <math.h> (the Symbian build links no C library for the core).
          #ifndef IMLAC_PLATFORM_H
          #define IMLAC_PLATFORM_H
          #include "Types.h"

          // ---- memory / strings -------------------------------------------------------

          static inline void mem_set(void* d, int v, unsigned n) {
              u8* p = (u8*)d;
              while (n--) *p++ = (u8)v;
          }
          static inline void mem_cpy(void* d, const void* s, unsigned n) {
              u8* dd = (u8*)d; const u8* ss = (const u8*)s;
              while (n--) *dd++ = *ss++;
          }
          static inline void mem_move(void* d, const void* s, unsigned n) {
              u8* dd = (u8*)d; const u8* ss = (const u8*)s;
              if (dd < ss) { while (n--) *dd++ = *ss++; }
              else { dd += n; ss += n; while (n--) *--dd = *--ss; }
          }
          static inline unsigned str_len(const char* s) { unsigned n = 0; while (s[n]) n++; return n; }
          static inline bool str_eq(const char* a, const char* b) {
              while (*a && *a == *b) { a++; b++; }
              return *a == *b;
          }
          static inline char up_char(char c) { return (c >= 'a' && c <= 'z') ? (char)(c - 32) : c; }
          // Copies at most cap-1 chars and always terminates.
          static inline void str_set(char* dst, int cap, const char* src) {
              int i = 0;
              while (src[i] && i < cap - 1) { dst[i] = src[i]; i++; }
              dst[i] = 0;
          }
          static inline void str_cat(char* dst, int cap, const char* src) {
              int n = (int)str_len(dst), i = 0;
              while (src[i] && n < cap - 1) dst[n++] = src[i++];
              dst[n] = 0;
          }
          // Appends an integer in the given base (10 or 16), padded to minWidth with '0'.
          static inline void str_cat_num(char* dst, int cap, unsigned v, int base, int minWidth, bool negative) {
              char tmp[16]; int n = 0;
              if (v == 0) tmp[n++] = '0';
              while (v && n < 15) { unsigned d = v % (unsigned)base; tmp[n++] = (char)(d < 10 ? '0' + d : 'A' + d - 10); v /= (unsigned)base; }
              while (n < minWidth && n < 15) tmp[n++] = '0';
              char out[18]; int o = 0;
              if (negative) out[o++] = '-';
              while (n) out[o++] = tmp[--n];
              out[o] = 0;
              str_cat(dst, cap, out);
          }
          static inline void str_cat_int(char* dst, int cap, int v, int minWidth) {
              if (v < 0) str_cat_num(dst, cap, (unsigned)(-v), 10, minWidth, true);
              else       str_cat_num(dst, cap, (unsigned)v, 10, minWidth, false);
          }
          static inline void str_cat_hex(char* dst, int cap, unsigned v, int minWidth) {
              str_cat_num(dst, cap, v, 16, minWidth, false);
          }
          static inline int parse_int(const char* s) {
              int sign = 1, v = 0;
              while (*s == ' ' || *s == '\t') s++;
              if (*s == '-') { sign = -1; s++; } else if (*s == '+') s++;
              while (*s >= '0' && *s <= '9') { v = v * 10 + (*s - '0'); s++; }
              return v * sign;
          }
          static inline unsigned parse_hex(const char* s) {
              unsigned v = 0;
              for (;; s++) {
                  char c = *s;
                  if (c >= '0' && c <= '9') v = v * 16 + (unsigned)(c - '0');
                  else if (c >= 'a' && c <= 'f') v = v * 16 + (unsigned)(c - 'a' + 10);
                  else if (c >= 'A' && c <= 'F') v = v * 16 + (unsigned)(c - 'A' + 10);
                  else break;
              }
              return v;
          }

          // ---- math (table based, no libm) --------------------------------------------

          double fm_sin(double x);
          double fm_cos(double x);
          double fm_sqrt(double x);
          static inline double fm_abs(double x) { return x < 0 ? -x : x; }
          // like fmod for |x| < 2^31 * m
          static inline double fm_mod(double x, double m) { return x - m * (double)(int)(x / m); }

