          for h in aknapp.h aknappui.h akndoc.h aknquerydialog.h aknutils.h avkon.hrh coecntrl.h e32base.h e32math.h e32std.h eikbtgpc.h eikenv.h eikon.hrh eikspane.h eikstart.h fbs.h imlacpds1.rsg w32std.h; do echo '#include "symbian_stub.h"' > host_test/stubs/$h; done
