name: Build Symbian^3 SIS (Imlac PDS-1)

# Port of the iOS Imlac PDS-1 emulator to native Symbian C++ (Avkon).
# Uses https://github.com/fieldops-dev/symbian3-toolchain, which targets Apple Silicon macOS,
# so the SIS job runs on a macOS arm64 runner. The first run builds GCC for arm-none-symbianelf
# (~1.5-2 h) and caches toolchain + SDK; later runs only compile the app (a few minutes).
#
# SELF-CONTAINED: this single file carries the whole Symbian port (symbian/ tree) and writes it at
# build time, so the repo only needs this workflow - no folders to copy.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      net:
        description: 'LAN multiplayer (needs Open C / libc.lib in the SDK). Untick for an offline build.'
        type: boolean
        default: true

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Write port sources
    runs-on: ubuntu-latest
    steps:
      - name: Generate symbian/ tree
        run: |
          set -e
          mkdir -p symbian
          cd symbian
          cat > README.md <<'IMLAC_EOF'
          # Imlac PDS-1 for Symbian^3 (Nokia N8 / C7 / E7 …)

          Native Symbian C++ (Avkon) port of the 32-bit iOS Imlac PDS-1 emulator.

          * `src/core/` – portable C++03 core: CPU + display processor + assembler (`Machine`), demos, Maze War
            (single player and UDP LAN multiplayer, wire-compatible with the iOS app), software phosphor-CRT renderer.
            No STL / exceptions / RTTI / heap, and no libc or libm (own `Platform.h`, `FMath.cpp`). Only `NetSession.cpp`
            needs Open C (`libc.lib`) for BSD sockets.
          * `src/symbian/` – Avkon front end: landscape full screen, touch D-pad + A/B, overlay menu, LAN status/chat.
          * `host_test/` – desktop checks (`run_tests.sh`): freestanding build of the core, ASan/UBSan smoke tests,
            rendered preview PNG, type-check of the Symbian layer against API stubs.
          * `.github/workflows/symbian-build.yml` – CI using fieldops-dev/symbian3-toolchain on a macOS arm64 runner.

          ## Build
          Push, then Actions → *Build Symbian^3 SIS* → Run workflow. First run builds GCC (~2 h) and caches it.
          Artifact: `imlacpds1.sisx` (self-signed). Untick **net** for an offline build if the SDK has no Open C.
          Local: `source symbian3-toolchain/Scripts/env.sh; cd group; bldmake bldfiles; abld build gcce urel;
          $N8_REPO/Scripts/package-sis.sh ../sis/imlacpds1.pkg`.

          ## Use
          Touch: D-pad = W/A/S/D, B/A = fire/space, **MENU** (top right) → Machine / Demos / Maze War (single, Host, Join,
          Disconnect, Send chat). Keys: arrows/WASD, Space/F/select = fire, left softkey or M = menu, other letters/digits go
          to the Imlac keyboard register. LAN play needs both phones on the same Wi-Fi (ports 7474/7475 UDP); the system may ask
          for an access point on first use.

          ## Status
          Verified on a desktop: core logic, renderer, assembler, all demos. **Not yet compiled against the real Symbian SDK
          or run on a device** – the front end was written without SDK access (type-checked only against stubs) and the
          network code was not exercised over a real network; expect small include/API fixes on the first CI run
          (the log is uploaded as the `abld-log` artifact). Differences from iOS: no on-screen Imlac keyboard (hardware keys
          only), no CRT scanline overlay, single-touch input, vector buffer 8192 instead of 32768, LAN keep-alive packets added.
          IMLAC_EOF
          mkdir -p data
          cat > data/imlacpds1.rss <<'IMLAC_EOF'
          NAME IMPD

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "Imlac";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "Imlac PDS-1";
                  number_of_icons = 0;
                  };
              }

          // Text entry for the LAN chat (max 15 characters, the wire format carries 15 bytes)
          RESOURCE DIALOG r_imlac_chat_query
              {
              flags = EGeneralQueryFlags;
              buttons = R_AVKON_SOFTKEYS_OK_CANCEL;
              items =
                  {
                  DLG_LINE
                      {
                      type = EAknCtQuery;
                      id = EGeneralQuery;
                      control = AVKON_DATA_QUERY
                          {
                          layout = EDataLayout;
                          label = "Chat message";
                          control = EDWIN
                              {
                              flags = EEikEdwinNoHorizScrolling | EEikEdwinResizable;
                              maxlength = 15;
                              width = 15;
                              lines = 1;
                              };
                          };
                      }
                  };
              }
          IMLAC_EOF
          mkdir -p data
          cat > data/imlacpds1_reg.rss <<'IMLAC_EOF'
          #include <appinfo.rh>
          #include <imlacpds1.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5C0DE

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "imlacpds1";
              localisable_resource_file = "\\resource\\apps\\imlacpds1";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          IMLAC_EOF
          mkdir -p group
          cat > group/bld.inf <<'IMLAC_EOF'
          PRJ_PLATFORMS
          DEFAULT

          PRJ_MMPFILES
          imlacpds1.mmp
          IMLAC_EOF
          mkdir -p group
          cat > group/imlacpds1.mmp <<'IMLAC_EOF'
          // Imlac PDS-1 emulator for Symbian^3 / S60 5th edition (Avkon), ported from the 32-bit iOS version.
          #include <platform_paths.hrh>

          TARGET          imlacpds1.exe
          TARGETTYPE      exe
          UID             0x100039CE 0xE1A5C0DE
          SECUREID        0xE1A5C0DE
          VENDORID        0
          // NetworkServices: LAN multiplayer sockets (user-grantable, works with a self-signed SIS)
          CAPABILITY      NetworkServices

          EPOCSTACKSIZE   0x14000
          EPOCHEAPSIZE    0x100000 0x1000000

          SOURCEPATH      ../src/symbian
          SOURCE          imlac_app.cpp
          SOURCE          imlac_appui.cpp
          SOURCE          imlac_container.cpp

          SOURCEPATH      ../src/core
          SOURCE          Machine.cpp
          SOURCE          Demos.cpp
          SOURCE          MazeWar.cpp
          SOURCE          CrtRender.cpp
          SOURCE          NetSession.cpp
          SOURCE          Rand.cpp
          SOURCE          VecFont.cpp
          SOURCE          FMath.cpp

          USERINCLUDE     ../src/symbian
          USERINCLUDE     ../src/core
          APP_LAYER_SYSTEMINCLUDE
          // Open C headers, needed only by NetSession.cpp (BSD sockets)
          SYSTEMINCLUDE   /epoc32/include/stdapis

          SOURCEPATH      ../data
          START RESOURCE  imlacpds1.rss
          HEADER
          TARGETPATH      /resource/apps
          END

          START RESOURCE  imlacpds1_reg.rss
          TARGETPATH      /private/10003a3f/import/apps
          END

          LIBRARY         euser.lib apparc.lib cone.lib eikcore.lib avkon.lib eikcoctl.lib eikdlg.lib
          LIBRARY         fbscli.lib bitgdi.lib gdi.lib ws32.lib
          // Open C: only for the sockets in NetSession.cpp. The emulator core itself links no C library.
          LIBRARY         libc.lib

          OPTION          GCCE -O2 -fno-strict-aliasing -fno-tree-loop-distribute-patterns
          IMLAC_EOF
          mkdir -p host_test
          cat > host_test/run_tests.sh <<'IMLAC_EOF'
          #!/usr/bin/env bash
          # Host-side checks for the port (no Symbian SDK needed). Run from anywhere: host_test/run_tests.sh
          set -euo pipefail
          cd "$(dirname "$0")/.."
          OUT=host_test/out; mkdir -p "$OUT"

          echo "== 1. core builds with NO system headers (freestanding) and has no libc/libm references"
          for f in Machine Demos MazeWar CrtRender Rand VecFont FMath; do
            g++ -std=gnu++98 -O2 -Wall -Wextra -pedantic -fno-exceptions -fno-rtti -nostdinc -ffreestanding \
                -fno-tree-loop-distribute-patterns -Isrc/core -c src/core/$f.cpp -o $OUT/$f.o
          done
          if nm -u $OUT/*.o | grep -E " U (mem|str|sin|cos|sqrt|fmod|fabs|printf|sprintf|snprintf|abs|atoi|malloc|calloc|free|__)" ; then echo "unexpected libc symbol"; exit 1; fi

          echo "== 2. unit/smoke tests under ASan+UBSan"
          g++ -std=gnu++98 -O1 -g -Wall -Wextra -fno-exceptions -fno-rtti -fsanitize=address,undefined \
              -fno-sanitize-recover=undefined host_test/test_core.cpp src/core/*.cpp -o $OUT/test_core -lm
          ( cd $OUT && ./test_core )

          echo "== 3. NetSession (sockets and offline variant)"
          g++ -std=gnu++98 -fsyntax-only -Wall -Wextra -Isrc/core src/core/NetSession.cpp
          g++ -std=gnu++98 -fsyntax-only -Wall -Wextra -DIMLAC_NO_NET -nostdinc -ffreestanding -Isrc/core src/core/NetSession.cpp

          echo "== 4. Symbian front end type-check against API stubs"
          for f in imlac_app imlac_appui imlac_container; do
            g++ -std=gnu++98 -fsyntax-only -Wall -Wextra -fno-exceptions -fno-rtti \
                -Ihost_test/stubs -Isrc/symbian -Isrc/core src/symbian/$f.cpp
          done

          echo "== 5. preview image"
          python3 - <<'PY' || echo "(Pillow missing - skipping preview)"
          from PIL import Image
          names=['star','liss','scope','spacewar','mw_title','mw_play']
          ims=[Image.open('host_test/out/out_%s.ppm'%n) for n in names]
          W,H=ims[0].size
          s=Image.new('RGB',(W*3,H*2))
          for i,im in enumerate(ims): s.paste(im,((i%3)*W,(i//3)*H))
          s.save('host_test/out/preview.png'); print('host_test/out/preview.png')
          PY
          echo "ALL CHECKS PASSED"
          IMLAC_EOF
          mkdir -p host_test
          cat > host_test/test_core.cpp <<'IMLAC_EOF'
          // Host-side smoke test for the portable core (no Symbian needed).
          // Builds with plain g++; exercises the CPU, assembler, all demos, Maze War and the renderer,
          // and writes a few frames as PPM so the output can be inspected.
          #include "../src/core/Machine.h"
          #include "../src/core/Demos.h"
          #include "../src/core/CrtRender.h"
          #include "../src/core/NetSession.h"
          #include "../src/core/Rand.h"
          #include "../src/core/Platform.h"
          #include <math.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>

          static int failures = 0;
          #define CHECK(c) do { if (!(c)) { printf("FAIL %s:%d  %s\n", __FILE__, __LINE__, #c); failures++; } } while (0)

          enum { W = 320, H = 320 };
          static u32 gFrame[W * H];

          static void savePpm(const char* name) {
              FILE* f = fopen(name, "wb");
              if (!f) return;
              fprintf(f, "P6\n%d %d\n255\n", W, H);
              for (int i = 0; i < W * H; i++) {
                  u32 p = gFrame[i];
                  fputc((int)((p >> 16) & 0xFF), f); fputc((int)((p >> 8) & 0xFF), f); fputc((int)(p & 0xFF), f);
              }
              fclose(f);
          }

          static void runFrames(Machine& m, Demos& d, int n) {
              for (int i = 0; i < n; i++) {
                  m.dlClear();
                  d.runCurrentDemo();
                  CrtRenderer::render(gFrame, W, H, W, m);
              }
          }

          static void testMath() {
              double worst = 0, worstSq = 0;
              for (int i = -20000; i <= 20000; i++) {
                  double x = i * 0.0173;
                  double e = fabs(fm_sin(x) - sin(x)); if (e > worst) worst = e;
                  e = fabs(fm_cos(x) - cos(x)); if (e > worst) worst = e;
              }
              for (int i = 0; i < 5000; i++) {
                  double x = i * 3.7;
                  double e = fabs(fm_sqrt(x) - sqrt(x)); if (e > worstSq) worstSq = e;
              }
              printf("fm_sin/cos max error %.2e, fm_sqrt max error %.2e\n", worst, worstSq);
              CHECK(worst < 1e-4);     // << 1 unit on a 1024-unit display (radius <= 460)
              CHECK(worstSq < 1e-6);
              char b[32]; b[0] = 0;
              str_cat_int(b, sizeof b, 42, 4); str_cat(b, sizeof b, "|"); str_cat_int(b, sizeof b, -7, 0);
              str_cat(b, sizeof b, "|"); str_cat_hex(b, sizeof b, 0xBEEF, 0);
              CHECK(str_eq(b, "0042|-7|BEEF"));
          }

          static void testCpu() {
              Machine m;
              const char* prog =
                  "; add two numbers\n"
                  ".org 0x50\n"
                  "start: LAW 5\n"
                  "  ADD val\n"
                  "  DAC out\n"
                  "  HLT\n"
                  "val: .word 7\n"
                  "out: .word 0\n";
              int words = m.assemble(prog);
              CHECK(words == 6);
              m.mp_pc = 0x50; m.mp_halt = false; m.mp_run = true;
              for (int i = 0; i < 20; i++) m.mpStep();
              CHECK(m.mp_halt);
              CHECK(m.mem[0x54] == 7);
              CHECK(m.mem[0x55] == 12);
              CHECK(strstr(m.console, "HALT") != 0);

              // display processor: set X, Y, draw a short vector
              Machine d;
              d.mem[0x100] = 0x1000 | 100;
              d.mem[0x101] = 0x2000 | 200;
              d.mem[0x102] = 0x3000 | (10 << 6) | 10;
              for (int i = 0; i < 3; i++) d.dpStep();
              CHECK(d.nvec == 1);
              CHECK(d.vecs[0].x1 == 100 && d.vecs[0].y1 == 200 && d.vecs[0].x2 == 110 && d.vecs[0].y2 == 210);
              CHECK(d.vecs[0].bright == 255);

              // skip/ISP behaviour + keyboard IOT
              Machine k;
              k.keyboard = 'W';
              k.mem[0] = 0xE000 | (0x01 << 6) | 1;   // IOT kbd, read
              k.mp_halt = false;
              k.mpStep();
              CHECK(k.mp_ac == 'W');
          }

          static void testDemos() {
              Machine m; Demos d(m);
              RandSeed(12345);
              static const DemoType all[] = { DemoTypeLines, DemoTypeStar, DemoTypeLissajous, DemoTypeText, DemoTypeBounce,
                                              DemoTypeMaze, DemoTypeSpacewar, DemoTypeScope };
              static const char* names[] = { "lines", "star", "liss", "text", "bounce", "maze", "spacewar", "scope" };
              for (unsigned i = 0; i < sizeof(all) / sizeof(all[0]); i++) {
                  d.setDemo(all[i]);
                  CrtRenderer::clear(gFrame, W, H, W);
                  runFrames(m, d, 90);
                  printf("demo %-8s nvec=%d\n", names[i], m.nvec);
                  CHECK(m.nvec > 0 && m.nvec < MACHINE_MAX_VEC);
                  char fn[64]; sprintf(fn, "out_%s.ppm", names[i]);
                  savePpm(fn);
              }
          }

          static void testMazeWar() {
              Machine m; Demos d(m);
              RandSeed(777);
              d.initMazeWar();
              MazeWarGame* g = d.getMazeWarGame();
              CHECK(g != 0);
              d.setDemo(DemoTypeMazeWar);

              CrtRenderer::clear(gFrame, W, H, W);
              runFrames(m, d, 30);                  // title screen
              CHECK(m.nvec > 10);
              savePpm("out_mw_title.ppm");

              g->iFire = true;                      // any button -> start
              runFrames(m, d, 2);
              g->iFire = false;
              // walk / turn / fire for a while, nothing may crash or overflow
              for (int f = 0; f < 3000; f++) {
                  m.keyboard = 0;
                  int r = f % 60;
                  if (r < 20) m.keyboard = 'W';
                  else if (r == 30) m.keyboard = 'D';
                  else if (r == 40) m.keyboard = 32;
                  else if (r == 50) m.keyboard = 'A';
                  runFrames(m, d, 1);
                  CHECK(m.nvec < MACHINE_MAX_VEC);
                  if (f == 400) savePpm("out_mw_play.ppm");
              }
              savePpm("out_mw_end.ppm");
              printf("mazewar ok, nvec=%d\n", m.nvec);

              // two games with the same seed must build the same maze (multiplayer determinism)
              Machine m1, m2; MazeWarGame a(m1), b(m2);
              a.onConnected(true, 123456789); b.onConnected(false, 123456789);
              m1.dlClear(); m2.dlClear();
              a.draw(); b.draw();
              CHECK(m1.nvec > 0);
          }

          static void testNetLifecycle() {
              // Only checks that the object can be created/stopped without a network (no sockets are opened here).
              NetSession n;
              CHECK(!n.isConnected());
              n.stop();
              n.poll();
          }

          int main() {
              testMath();
              testCpu();
              testDemos();
              testMazeWar();
              testNetLifecycle();
              if (failures) { printf("%d FAILURES\n", failures); return 1; }
              printf("ALL OK\n");
              return 0;
          }
          IMLAC_EOF
          mkdir -p sis
          cat > sis/imlacpds1.pkg <<'IMLAC_EOF'
          ; Imlac PDS-1 for Symbian^3 - install package (paths are expanded by package-sis.sh)
          &EN
          #{"Imlac PDS-1"},(0xE1A5C0DE),1,0,0

          %{"Sheva / Symbian port"}
          :"Symbian port"

          ; Symbian^3 / S60 5th / S60 3rd platform IDs
          [0x20022E6D], 0, 0, 0, {"S60ProductID"}
          [0x1028315F], 0, 0, 0, {"S60ProductID"}
          [0x102752AE], 0, 0, 0, {"S60ProductID"}
          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}

          "$(epocroot)epoc32/release/$(platform)/$(target)/imlacpds1.exe"-"!:\sys\bin\imlacpds1.exe"
          "$(epocroot)epoc32/data/z/resource/apps/imlacpds1.rsc"-"!:\resource\apps\imlacpds1.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/imlacpds1_reg.rsc"-"!:\private\10003a3f\import\apps\imlacpds1_reg.rsc"
          IMLAC_EOF
          mkdir -p src/core
          cat > src/core/CrtRender.cpp <<'IMLAC_EOF'
          #include "CrtRender.h"
          #include "Platform.h"

          // Brightness levels are quantised to 10 steps like the iOS renderer.
          #define CRT_BUCKETS 10

          namespace {

          struct Ctx {
              u32* px; int w, h, stride;
              u32 core[CRT_BUCKETS];
              u32 glow[CRT_BUCKETS];
              u32 corner[CRT_BUCKETS];
          };

          inline u32 packRGB(u32 r, u32 g, u32 b) { return (r << 16) | (g << 8) | b; }

          // Saturating per-channel add of two 0x00RRGGBB values.
          inline void addPx(u32* p, u32 add) {
              u32 v = *p;
              u32 rb = (v & 0x00FF00FFu) + (add & 0x00FF00FFu);
              u32 g  = (v & 0x0000FF00u) + (add & 0x0000FF00u);
              rb |= ((rb >> 8) & 0x00010001u) * 0xFFu;
              g  |= ((g >> 16) & 1u) * 0xFF00u;
              *p = (rb & 0x00FF00FFu) | (g & 0x0000FF00u);
          }

          inline void plotAdd(Ctx& c, int x, int y, u32 add) {
              if ((unsigned)x < (unsigned)c.w && (unsigned)y < (unsigned)c.h) addPx(&c.px[y * c.stride + x], add);
          }

          inline void plotCore(Ctx& c, int x, int y, int k) {
              plotAdd(c, x, y, c.core[k]);
              plotAdd(c, x + 1, y, c.glow[k]);
              plotAdd(c, x - 1, y, c.glow[k]);
              plotAdd(c, x, y + 1, c.glow[k]);
              plotAdd(c, x, y - 1, c.glow[k]);
          }

          void drawLine(Ctx& c, int x0, int y0, int x1, int y1, int k) {
              int dx = x1 - x0; if (dx < 0) dx = -dx;
              int dy = y1 - y0; if (dy < 0) dy = -dy;
              int sx = x0 < x1 ? 1 : -1;
              int sy = y0 < y1 ? 1 : -1;
              int err = dx - dy;
              // Reject lines that are wildly off-screen before walking them.
              if ((x0 < -64 && x1 < -64) || (y0 < -64 && y1 < -64) ||
                  (x0 > c.w + 64 && x1 > c.w + 64) || (y0 > c.h + 64 && y1 > c.h + 64)) return;
              for (;;) {
                  plotCore(c, x0, y0, k);
                  if (x0 == x1 && y0 == y1) break;
                  int e2 = 2 * err;
                  if (e2 > -dy) { err -= dy; x0 += sx; }
                  if (e2 < dx)  { err += dx; y0 += sy; }
              }
          }

          void drawPoint(Ctx& c, int x, int y, int k) {
              plotAdd(c, x, y, c.core[k]);
              plotAdd(c, x + 1, y, c.core[k]);
              plotAdd(c, x - 1, y, c.core[k]);
              plotAdd(c, x, y + 1, c.core[k]);
              plotAdd(c, x, y - 1, c.core[k]);
              plotAdd(c, x + 1, y + 1, c.glow[k]);
              plotAdd(c, x - 1, y - 1, c.glow[k]);
              plotAdd(c, x + 1, y - 1, c.glow[k]);
              plotAdd(c, x - 1, y + 1, c.glow[k]);
          }

          }  // namespace

          void CrtRenderer::clear(u32* px, int w, int h, int stride) {
              for (int y = 0; y < h; y++) mem_set(px + y * stride, 0, (unsigned)w * 4);
          }

          void CrtRenderer::render(u32* px, int w, int h, int stride, const Machine& m) {
              // 1) phosphor decay: every channel *= 217/256 (~0.85, same as the 0.15 black fill on iOS)
              for (int y = 0; y < h; y++) {
                  u32* row = px + y * stride;
                  for (int x = 0; x < w; x++) {
                      u32 v = row[x];
                      if (!v) continue;
                      u32 rb = (((v & 0x00FF00FFu) * 217u) >> 8) & 0x00FF00FFu;
                      u32 g  = ((((v >> 8) & 0xFFu) * 217u) & 0xFF00u);
                      row[x] = rb | g;
                  }
              }

              // 2) colour tables per brightness bucket (green phosphor with a cool core)
              Ctx c;
              c.px = px; c.w = w; c.h = h; c.stride = stride;
              for (int k = 0; k < CRT_BUCKETS; k++) {
                  u32 a = (u32)(k + 1);                         // 1..10
                  c.core[k]   = packRGB((a * 26) / 10, (a * 255) / 10, (a * 70) / 10);
                  c.glow[k]   = packRGB(0, (a * 90) / 10, (a * 22) / 10);
                  c.corner[k] = packRGB(0, (a * 45) / 10, (a * 11) / 10);
              }

              // 3) vectors
              const int sxn = w - 1, syn = h - 1;
              const int n = m.nvec < MACHINE_MAX_VEC ? m.nvec : MACHINE_MAX_VEC;
              for (int i = 0; i < n; i++) {
                  const MachineVec& v = m.vecs[i];
                  int k = ((int)v.bright * CRT_BUCKETS + 127) / 255;     // 0..10
                  if (k < 1) continue;                                   // invisible
                  if (k > CRT_BUCKETS) k = CRT_BUCKETS;
                  k -= 1;
                  // PDS Y axis points up (CoreGraphics bitmap origin on iOS is bottom-left), screen rows grow downwards.
                  int x1 = ((int)v.x1 * sxn) >> 10, y1 = syn - (((int)v.y1 * syn) >> 10);
                  if (v.isPoint) { drawPoint(c, x1, y1, k); continue; }
                  int x2 = ((int)v.x2 * sxn) >> 10, y2 = syn - (((int)v.y2 * syn) >> 10);
                  drawLine(c, x1, y1, x2, y2, k);
              }
          }
