          // ---- helpers --------------------------------------------------------------

          void Demos::vl(int x1, int y1, int x2, int y2, float b) { M.dlLine(x1, y1, x2, y2, b); }
          void Demos::vp(int x, int y, float b) { M.dlPoint(x, y, b); }

          void Demos::rect(int x, int y, int w, int h, float b) {
              vl(x, y, x + w, y, b);
              vl(x + w, y, x + w, y + h, b);
              vl(x + w, y + h, x, y + h, b);
              vl(x, y + h, x, y, b);
          }

          void Demos::circle(int cx, int cy, int r, int segs, float b) {
              int px = cx + r, py = cy;
              for (int i = 1; i <= segs; i++) {
                  double a = (double)i / (double)segs * 2 * M_PI;
                  int nx = cx + (int)(fm_cos(a) * r), ny = cy + (int)(fm_sin(a) * r);
                  vl(px, py, nx, ny, b);
                  px = nx; py = ny;
              }
          }

          void Demos::border(float b) { rect(20, 20, 984, 984, b); }

          // ---- vector font ----------------------------------------------------------

          void Demos::vchar(char c, int ox, int oy, float sc, float b) {
              int idx = VecFontIndex(c);
              if (idx < 0) return;
              int n = kVecFontSegs[idx];
              for (int s = 0; s < n; s++) {
                  const signed char* seg = kVecFont[idx][s];
                  vl(ox + (int)(seg[0] * sc), oy + (int)(seg[1] * sc), ox + (int)(seg[2] * sc), oy + (int)(seg[3] * sc), b);
              }
          }

          void Demos::vtext(const char* s, int ox, int oy, float sc, float b) {
              int x = ox;
              for (; *s; ++s) { vchar(*s, x, oy, sc, b); x += (int)(sc * 5.5f); }
          }

          // ---- LINES ----------------------------------------------------------------

          void Demos::demoLines() {
              int cx = 512, cy = 512; double r = 450.0;
              for (int i = 0; i < 20; i++) {
                  double a1 = (double)i / 20 * 2 * M_PI + angle;
                  double a2 = (double)(i + 7) / 20 * 2 * M_PI + angle * 0.7;
                  vl(cx + (int)(fm_cos(a1) * r), cy + (int)(fm_sin(a1) * r),
                     cx + (int)(fm_cos(a2) * r / 2), cy + (int)(fm_sin(a2) * r / 2), 0.85f);
              }
              for (int i = 0; i < 8; i++) {
                  double a = (double)i / 8 * 2 * M_PI - angle * 0.3;
                  vl(cx, cy, cx + (int)(fm_cos(a) * r), cy + (int)(fm_sin(a) * r), 0.3f);
              }
              border(0.5f);
              vtext("IMLAC PDS-1", 280, 80, 16, 0.7f);
              vtext("ROTATING LINES", 200, 30, 10, 0.4f);
          }

          // ---- STAR -----------------------------------------------------------------

          void Demos::drawStar(int cx, int cy, int pts, int r1, int r2, double a0, float b) {
              int n = pts * 2;
              for (int i = 0; i < n; i++) {
                  double a1 = (double)i / (double)n * 2 * M_PI + a0;
                  double a2 = (double)(i + 1) / (double)n * 2 * M_PI + a0;
                  int ra = (i % 2 == 0) ? r1 : r2;
                  int rb = ((i + 1) % 2 == 0) ? r1 : r2;
                  vl(cx + (int)(fm_cos(a1) * ra), cy + (int)(fm_sin(a1) * ra),
                     cx + (int)(fm_cos(a2) * rb), cy + (int)(fm_sin(a2) * rb), b);
              }
          }

          void Demos::demoStar() {
              drawStar(512, 512, 7, 400, 160, angle, 1.0f);
              drawStar(512, 512, 5, 120, 50, -angle * 2.5, 0.7f);
              border(0.4f);
              vtext("STAR", 380, 60, 20, 0.6f);
          }

          // ---- LISSAJOUS ------------------------------------------------------------

          void Demos::demoLissajous() {
              int px = -1, py = -1;
              for (int i = 0; i <= 600; i++) {
                  double tt = (double)i / 600 * 2 * M_PI;
                  int x = 512 + (int)(460 * fm_sin(3 * tt + angle));
                  int y = 512 + (int)(460 * fm_sin(2 * tt));
                  if (px >= 0) vl(px, py, x, y, 0.85f);
                  px = x; py = y;
              }
              border(0.4f);
              vtext("LISSAJOUS", 300, 60, 16, 0.5f);
          }

          // ---- TEXT -----------------------------------------------------------------

          void Demos::demoText() {
              static const char* const lines[12] = {
                  "IMLAC PDS-1", "1970 MIT AI LAB", "PROGRAMMED", "DISPLAY SYSTEM",
                  "16-BIT CPU", "4096 WORDS RAM", "VECTOR CRT", "1024 X 1024", "LIGHT PEN",
                  "SPACEWAR 1974", "ARPANET NODE", "LOGO LANGUAGE"
              };
              const int count = 12;
              for (int i = 0; i < count; i++) {
                  double raw = 780.0 - (double)i * 140 + textScroll;
                  double modv = fm_mod(raw, 1100.0);
                  if (modv < 0) modv += 1100.0;
                  int y = (int)modv - 100;
                  if (y > -80 && y < 1050) vtext(lines[i], 80, y, 20, 0.9f);
              }
              textScroll += 1.5;
              if (textScroll > (double)count * 145) textScroll = 0;
              border(0.3f);
          }

          // ---- BOUNCE ---------------------------------------------------------------

          void Demos::demoBounce() {
              ballX += ballVx; ballY += ballVy;
              if (ballX < 60 || ballX > 964) { ballVx *= -1; ballX = dmax(60.0, dmin(964.0, ballX)); }
              if (ballY < 60 || ballY > 964) { ballVy *= -1; ballY = dmax(60.0, dmin(964.0, ballY)); }
              if (trailN < 15) {
                  trailX[trailN] = ballX; trailY[trailN] = ballY; trailN += 1;
              } else {
                  for (int i = 0; i < 14; i++) { trailX[i] = trailX[i + 1]; trailY[i] = trailY[i + 1]; }
                  trailX[14] = ballX; trailY[14] = ballY;
              }
              for (int i = 0; i < trailN - 1; i++) vp((int)trailX[i], (int)trailY[i], (float)(i + 1) / (float)trailN * 0.4f);
              circle((int)ballX, (int)ballY, 35, 16, 1.0f);
              vl((int)ballX - 50, (int)ballY, (int)ballX + 50, (int)ballY, 0.25f);
              vl((int)ballX, (int)ballY - 50, (int)ballX, (int)ballY + 50, 0.25f);
              static const int corners[2] = {60, 964};
              for (int a = 0; a < 2; a++)
                  for (int c = 0; c < 2; c++) circle(corners[a], corners[c], 20, 8, 0.4f);
              rect(20, 20, 984, 984, 0.6f);
              vtext("BOUNCE", 350, 40, 14, 0.6f);
          }

          // ---- MAZE -----------------------------------------------------------------

          static const int kCDX[4]  = {0, 1, 0, -1};
          static const int kCDY[4]  = {1, 0, -1, 0};
          static const int kCOPP[4] = {2, 3, 0, 1};

          void Demos::demoMaze() {
              if (!mazeReady) initMaze();
              const int MW = DEMO_MW, MH = DEMO_MH;
              int cw = (1024 - 60) / MW, ch = (1024 - 60) / MH, ox = 30, oy = 30;
              for (int y = 0; y < MH; y++) {
                  for (int x = 0; x < MW; x++) {
                      int cell = mazeGrid[y][x];
                      int px = ox + x * cw, py = oy + y * ch;
                      if (cell & 1) vl(px, py + ch, px + cw, py + ch, 0.85f);
                      if (cell & 2) vl(px + cw, py, px + cw, py + ch, 0.85f);
                      if (cell & 4) vl(px, py, px + cw, py, 0.85f);
                      if (cell & 8) vl(px, py, px, py + ch, 0.85f);
                  }
              }
              circle(ox + cw / 2, oy + ch / 2, 12, 8, 0.6f);
              circle(ox + (MW - 1) * cw + cw / 2, oy + (MH - 1) * ch + ch / 2, 12, 8, 1.0f);
              vtext("MAZE", 370, 965, 14, 0.55f);
          }

          void Demos::initMaze() {
              for (int y = 0; y < DEMO_MH; y++)
                  for (int x = 0; x < DEMO_MW; x++) mazeGrid[y][x] = 0xF;
              bool vis[DEMO_MH][DEMO_MW];
              mem_set(vis, 0, sizeof(vis));
              carveMaze(0, 0, vis);
              mazeReady = true;
          }

          void Demos::carveMaze(int x, int y, bool vis[DEMO_MH][DEMO_MW]) {
              vis[y][x] = true;
              int dirs[4] = {0, 1, 2, 3};
              for (int i = 3; i > 0; i--) {
                  int j = (int)RandBelow((u32)(i + 1));
                  int tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
              }
              for (int k = 0; k < 4; k++) {
                  int d = dirs[k];
                  int nx = x + kCDX[d], ny = y + kCDY[d];
                  if (nx < 0 || nx >= DEMO_MW || ny < 0 || ny >= DEMO_MH || vis[ny][nx]) continue;
                  mazeGrid[y][x]   &= ~(1 << d);
                  mazeGrid[ny][nx] &= ~(1 << kCOPP[d]);
                  carveMaze(nx, ny, vis);
              }
          }

          // ---- SPACEWAR -------------------------------------------------------------

          static double wrap1024(double v) { v = fm_mod(v, 1024.0); if (v < 0) v += 1024.0; return v; }

          void Demos::demoSpacewar() {
              if (!swInit) { mem_set(blife, 0, sizeof(blife)); swInit = true; }
              sw1a += 0.025; sw2a += 0.025;
              double dx1 = 512 - sw1x, dy1 = 512 - sw1y; double d1 = fm_sqrt(dx1 * dx1 + dy1 * dy1);
              if (d1 > 1) { sw1vx += dx1 / d1 * 0.15; sw1vy += dy1 / d1 * 0.15; }
              double dx2 = 512 - sw2x, dy2 = 512 - sw2y; double d2 = fm_sqrt(dx2 * dx2 + dy2 * dy2);
              if (d2 > 1) { sw2vx += dx2 / d2 * 0.15; sw2vy += dy2 / d2 * 0.15; }
              sw1x += sw1vx; sw1y += sw1vy; sw2x += sw2vx; sw2y += sw2vy;

              sw1x = wrap1024(sw1x); sw1y = wrap1024(sw1y);
              sw2x = wrap1024(sw2x); sw2y = wrap1024(sw2y);

              if (frame % 40 == 0) fireSW(sw1x, sw1y, sw1a, sw1vx, sw1vy);
              if (frame % 53 == 0) fireSW(sw2x, sw2y, sw2a, sw2vx, sw2vy);

              for (int i = 0; i < 4; i++) {
                  if (blife[i] <= 0) continue;
                  blife[i] -= 1;
                  bx[i] += bvx[i]; by[i] += bvy[i];
                  vp((int)bx[i], (int)by[i], 1.0f);
              }
              circle(512, 512, 25, 12, 0.6f);
              circle(512, 512, 8, 8, 1.0f);
              drawShip((int)sw1x, (int)sw1y, sw1a, 1.0f);
              drawShip((int)sw2x, (int)sw2y, sw2a + M_PI, 0.85f);
              vtext("SPACEWAR", 310, 960, 14, 0.5f);
              rect(20, 20, 984, 984, 0.3f);
          }

          void Demos::fireSW(double x, double y, double a, double vx, double vy) {
              for (int i = 0; i < 4; i++) {
                  if (blife[i] > 0) continue;
                  bx[i] = x; by[i] = y;
                  bvx[i] = fm_cos(a) * 9 + vx; bvy[i] = fm_sin(a) * 9 + vy;
                  blife[i] = 80;
                  break;
              }
          }

          void Demos::drawShip(int cx, int cy, double a, float b) {
              double r1 = 30.0, r2 = 20.0, da = 2.5;
              int p1x = cx + (int)(fm_cos(a) * r1),      p1y = cy + (int)(fm_sin(a) * r1);
              int p2x = cx + (int)(fm_cos(a + da) * r2), p2y = cy + (int)(fm_sin(a + da) * r2);
              int p3x = cx + (int)(fm_cos(a - da) * r2), p3y = cy + (int)(fm_sin(a - da) * r2);
              vl(p1x, p1y, p2x, p2y, b);
              vl(p2x, p2y, p3x, p3y, b);
              vl(p3x, p3y, p1x, p1y, b);
          }

          // ---- SCOPE ----------------------------------------------------------------

          void Demos::demoScope() {
              static const double freqA[4] = {1.0, 2.0, 3.0, 5.0};
              static const double freqB[4] = {1.0, 3.0, 4.0, 4.0};
              static const float  brs[4]   = {0.9f, 0.7f, 0.55f, 0.4f};
              for (int f = 0; f < 4; f++) {
                  double ph = angle * (double)(f + 1) * 0.3;
                  int px = -1, py = -1;
                  for (int i = 0; i <= 400; i++) {
                      double tt = (double)i / 400 * 2 * M_PI;
                      int x = 512 + (int)(440 * fm_sin(freqA[f] * tt + ph));
                      int y = 512 + (int)(440 * fm_sin(freqB[f] * tt));
                      if (px >= 0) vl(px, py, x, y, brs[f]);
                      px = x; py = y;
                  }
              }
              border(0.4f);
              vtext("SCOPE", 380, 60, 14, 0.5f);
          }

