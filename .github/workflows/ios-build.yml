name: Build 32-bit iOS App

on:
  push:
    branches: [ "main", "32ios" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make zip

      - name: Run Makefile
        run: |
          # Запуск компиляции через Makefile в корню репозитория
          make

      - name: Package IPA / App
        run: |
          # Создаем структуру Payload для создания .ipa пакета
          mkdir -p Payload
          if [ -d "*.app" ]; then
            cp -r *.app Payload/
          else
            mkdir -p Payload/ShevaPDS1.app
            cp -r * Payload/ShevaPDS1.app/ 2>/dev/null || true
          fi
          zip -r ShevaPDS1-iOS93.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShevaPDS1-iOS9.3-Build
          path: |
            *.ipa
            *.deb
            Payload/
          retention-days: 7
