name: Build 32-bit iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make zip perl git libpango1.0-dev libglib2.0-dev curl

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/* $HOME/theos/sdks/
          rm -rf /tmp/sdks

      - name: Setup Theos Linux Toolchain
        run: |
          # Скачиваем официальный Linux-тулчейн для Theos
          mkdir -p $HOME/theos/toolchain/linux/iphone
          curl -LO https://github.com/theos/toolchain/releases/download/v1.0.0/linux-arm64-toolchain.tar.gz || \
          curl -LO https://github.com/saurik/ldid/releases/download/v2.1.5/ldid-x86_64
          
          # Устанавливаем ldid для подписи бинарников
          sudo curl -Lo /usr/local/bin/ldid https://github.com/saurik/ldid/releases/download/v2.1.5/ldid-x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Run Build
        run: |
          export THEOS=$HOME/theos
          # Указываем Theos использовать системный Clang, если нет отдельного тулчейна
          make clean
          make FINALPACKAGE=1 ARCHS="armv7" TARGET="iphone:clang:9.3:9.0" TARGET_CC="clang" TARGET_CXX="clang++"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShevaPDS1-iOS9.3-Build
          path: |
            packages/
            .theos/obj/
            *.deb
            *.ipa
          retention-days: 7
