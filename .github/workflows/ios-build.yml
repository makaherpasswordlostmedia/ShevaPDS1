name: Build 32-bit iOS App

on:
  push:
    branches: [ "main", "32ios" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make zip perl git libpango1.0-dev libglib2.0-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          # Скачиваем патченный SDK для кросс-компиляции на Linux
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Run Build
        run: |
          export THEOS=$HOME/theos
          # Указываем целевую архитектуру armv7 для iOS 9.3
          make clean
          make FINALPACKAGE=1 ARCHS="armv7" TARGET="iphone:clang:9.3:9.0"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShevaPDS1-iOS9.3-Build
          path: |
            packages/
            .theos/obj/
            *.deb
            *.ipa
          retention-days: 7
