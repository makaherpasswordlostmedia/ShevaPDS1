plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imlac.pds1'
    compileSdk 34

    defaultConfig {
        applicationId "com.imlac.pds1"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // NDK/CMake build producing libpds1native.so (SDL2 + crt_renderer +
    // jni_bridge + android_main + ui_widgets + input_bridge). See
    // app/src/main/cpp/CMakeLists.txt for the vendored-SDL2 setup
    // instructions — SDL2 source must be extracted into
    // app/src/main/cpp/SDL2 before this will configure successfully.
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    ndkVersion "26.1.10909125"
}

dependencies {
    // No external dependencies beyond the vendored SDL2 native source
    // (built via CMake, see externalNativeBuild above) — pure Android
    // SDK + NDK, no Maven/Gradle deps.
}
